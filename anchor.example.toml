# ANCHOR team config
#
# Copy this file to anchor.toml (or point ANCHOR_CONFIG at it) and change it to
# fit how your team works. Every section is optional. Anything you leave out
# uses the open default, so a team can start with an empty file and add
# structure only where it helps.
#
# Changes take effect the next time the web app or MCP server starts.
#
# Note for TOML: plain settings like the two below must come before the first
# [section] header.

# Role given to a name the first time it shows up. Anyone not listed under
# [people] gets this role until someone changes it.
default_role = "contributor"

# Which work modes the app shows in its navigation. Leave out any your team
# does not use yet. Everything still works over MCP.
modes = ["home", "studies", "findings", "explore", "validate", "decisions"]


# ---------------------------------------------------------------------------
# Roles
#
# Roles inform, they never block. Each validation shows the validator's role,
# and each finding shows a summary like "2 researcher, 1 peer".
#
# trusted = true means validations from this role count as trusted. Everyone
# else's count as peer. Rename labels freely. You can add your own roles too,
# for example a data science lead whose checks you want to weigh like a
# researcher's.
# ---------------------------------------------------------------------------

[roles.researcher]
label = "Researcher"
trusted = true

[roles.trusted_reviewer]
label = "Trusted reviewer"
trusted = true

[roles.contributor]
label = "People who do research"
trusted = false

[roles.stakeholder]
label = "Stakeholder"
trusted = false

# [roles.data_science]
# label = "Data science"
# trusted = true

# ---------------------------------------------------------------------------
# People
#
# Name = role. This file is the source of truth for everyone listed here: their
# role is reset to this value each time ANCHOR starts. People who are not
# listed can still join. They get the default role on first use.
#
# Trusted reviewers can sit outside the research team, for example a domain
# expert in finance or a data science lead.
# ---------------------------------------------------------------------------

[people]
# "Sam" = "researcher"
# "Lee" = "researcher"
# "Dana" = "trusted_reviewer"
# "Jordan" = "contributor"
# "Morgan" = "stakeholder"


# ---------------------------------------------------------------------------
# Tier labels
#
# What your team calls each tier. The meaning stays the same: a data point is
# a fact with no interpretation, a hypothesis is a read on what it might mean,
# and an insight is safe to build decisions on.
# ---------------------------------------------------------------------------

[tiers]
data_point = "Data point"
hypothesis = "Hypothesis"
insight = "Insight"


# ---------------------------------------------------------------------------
# How I checked
#
# When someone validates, they can say how they checked. These are the
# choices they see. Rename them to match your team's language.
# ---------------------------------------------------------------------------

[checks]
evidence = "Reviewed the evidence"
source_data = "Checked the source data"
reproduced = "Reproduced it"
judgment = "Domain judgment"


# ---------------------------------------------------------------------------
# Study template
#
# Every study captures its objective, the decision it serves, method, and
# sample. Add the fields your team also needs. required = true shows a warning
# when the field is empty. It never blocks, so people can start a study and
# fill in details later.
#
# Tip: if your team already has an intake form or tracker, add a field for
# its link so every study points back to it.
# ---------------------------------------------------------------------------

# [[study.fields]]
# key = "intake_link"
# label = "Intake ticket"
# help = "Link to the request in your team's tracker"

# [[study.fields]]
# key = "participants"
# label = "Participant criteria"
# required = true

# [[study.fields]]
# key = "deadline"
# label = "Decision date"
# help = "When the decision this study serves will be made"


# ---------------------------------------------------------------------------
# Promotion
#
# Anyone can promote a data point to a hypothesis, or a hypothesis to an
# insight. Promotion creates a new, linked finding, so the original stays as
# it was.
#
# Set rules below to show when a finding is "ready to promote". A finding is
# ready when any rule is met. With no rules, every finding is ready.
#
# enforce = "signal" shows readiness but lets anyone promote at any time.
# enforce = "required" stops promotion until a rule is met.
# ---------------------------------------------------------------------------

[promote]
# min_validations = 2           # this many approvals from anyone
# min_trusted_validations = 1   # or this many from trusted roles
# trusted_roles_ready = true    # or the person promoting has a trusted role
enforce = "signal"

