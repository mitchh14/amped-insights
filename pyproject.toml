[project]
name = "anchor"
version = "0.1.0"
description = "ANCHOR (Amped Network for Credible Hypotheses, Observations, and Research): a shared, checkable layer of research findings"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["mcp>=1.2"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
anchor-mcp = "anchor.mcp_server:main"
anchor-web = "anchor.web:main"

[tool.setuptools]
packages = ["anchor"]

[tool.setuptools.package-data]
anchor = ["static/*.html"]
