<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ANCHOR Workbench</title>
<link rel="icon" href="data:,">
<style>
  /* The workbench. Blocks build up from a base of context and method.
     How full a block is says how checked it is. Only trouble gets words and
     color: needs a check, needs changes, disagreement, rests on nothing.
     System fonts only: the app makes no outside calls. */
  :root {
    --bg: #ECEFF3; --surface: #FFFFFF; --ink: #15202C; --muted: #5A6776; --line: #C4CDD8;
    --accent: #2D5BD7; --accent-soft: #E3EAFB;
    --fill-owner: #DDE6F7; --fill-peers: #A9C1F2; --fill-sme: #2D5BD7; --on-sme: #FFFFFF;
    --amber: #A8660C; --amber-bg: #FFF1D9; --red: #C23B32; --red-bg: #FDE5E2; --glow: #F2B33D;
    --slab: #CBD3DC; --slab-2: #BAC4CF; --stone: #DFE4EA;
    --shadow: 0 1px 0 rgba(21,32,44,.08), 0 2px 6px rgba(21,32,44,.06);
    --f-body: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --f-mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0E141B; --surface: #17202A; --ink: #E4EAF1; --muted: #93A1B1; --line: #2D3947;
      --accent: #6F97FF; --accent-soft: #1C2A44;
      --fill-owner: #1F2E45; --fill-peers: #2B4A82; --fill-sme: #4C7DF0; --on-sme: #FFFFFF;
      --amber: #E6A646; --amber-bg: #3A2A12; --red: #F0766C; --red-bg: #3D1C1A; --glow: #F2B33D;
      --slab: #26313E; --slab-2: #1F2833; --stone: #2B3643;
      --shadow: 0 1px 0 rgba(0,0,0,.4), 0 2px 8px rgba(0,0,0,.3);
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 var(--f-body); }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  a { color: var(--accent); }

  .app { display: grid; grid-template-columns: minmax(0, 1fr); min-height: 100%; }
  .app.panel-open { grid-template-columns: minmax(0, 1fr) 390px; }
  .col { min-width: 0; display: flex; flex-direction: column; }

  /* Top bar */
  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 18px; padding: 10px 24px; border-bottom: 1px solid var(--line); }
  .brand { font-weight: 800; font-size: 16px; letter-spacing: .04em; color: var(--ink); text-decoration: none; }
  .nav { display: flex; flex-wrap: wrap; gap: 2px 14px; align-items: center; font-size: 13px; flex: 1; }
  .nav a { color: var(--ink); text-decoration: none; font-weight: 600; }
  .nav .later { color: var(--muted); opacity: .7; }
  .who { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); }
  .who select { padding: 4px 6px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); }

  /* Main */
  .main { padding: 18px 24px 28px; display: flex; flex-direction: column; gap: 14px; }
  .top { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: flex-end; justify-content: space-between; }
  h1 { font-weight: 800; font-size: 25px; line-height: 1.15; margin: 0 0 3px; text-wrap: balance; letter-spacing: -.01em; }
  h2 { font-size: 17px; margin: 0; }
  .for { color: var(--muted); font-size: 13px; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .btn { border: 1px solid var(--line); background: var(--surface); padding: 7px 12px; border-radius: 7px; box-shadow: var(--shadow); white-space: nowrap; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .btn.ghost { background: none; box-shadow: none; }
  .btn[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .btn:disabled { opacity: .45; cursor: default; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
  .seg button { border: 0; background: none; padding: 7px 14px; }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
  .linkbtn { border: 0; background: none; color: var(--accent); padding: 0; font-weight: 500; }
  .note { font-size: 12.5px; color: var(--muted); }
  .loading { color: var(--muted); padding: 40px 0; }

  /* Home */
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: 12px; }
  .card { background: var(--surface); border-radius: 12px; box-shadow: var(--shadow); padding: 16px; display: flex; flex-direction: column; gap: 8px; text-align: left; border: 1px solid transparent; }
  .card:hover { border-color: var(--line); }
  .card .q { font-weight: 700; font-size: 16px; line-height: 1.25; }
  .mini { display: flex; flex-wrap: wrap; gap: 3px; }
  .mini i { width: 12px; height: 8px; border-radius: 2px; border: 1px solid var(--line); display: block; }
  .form { background: var(--surface); border-radius: 12px; box-shadow: var(--shadow); padding: 16px; display: grid; gap: 8px; max-width: 640px; }
  .form input, .form textarea { width: 100%; padding: 8px 10px; border-radius: 7px; border: 1px solid var(--line); background: var(--bg); }

  /* Package tray */
  .tray { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; font-size: 13px; color: var(--muted); }
  .tray b { color: var(--ink); font-size: 14px; }
  .tray .pill { display: inline-flex; align-items: center; gap: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px 6px 3px 10px; color: var(--ink); max-width: 280px; }
  .tray .pill span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .tray .pill button { border: 0; background: none; color: var(--muted); padding: 0 4px; }

  /* Build canvas */
  .canvas-wrap { overflow-x: auto; overflow-y: hidden; border-radius: 14px; background: var(--surface); box-shadow: var(--shadow); }
  .canvas { position: relative; }
  .canvas svg.wires { position: absolute; inset: 0; pointer-events: none; }
  .wire { fill: none; stroke: var(--muted); stroke-width: 1.4; opacity: .5; transition: opacity .15s; }
  .wire.weak { stroke-dasharray: 4 4; stroke: var(--amber); opacity: .85; }
  .wire.src { stroke-dasharray: 2 3; opacity: .35; }
  .wire.hot { stroke: var(--accent); opacity: 1; stroke-width: 2.2; }
  .canvas.exploring .wire:not(.hot) { opacity: .08; }
  .row-label { position: absolute; left: 14px; font-size: 10.5px; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); }

  .brick { position: absolute; border-radius: 6px; padding: 12px 12px 10px; background: var(--fill-owner); border: 1.5px solid color-mix(in srgb, var(--accent) 35%, var(--line)); display: flex; flex-direction: column; gap: 6px; cursor: pointer; transition: transform .12s ease, box-shadow .12s ease, opacity .15s; text-align: left; }
  .brick:hover { transform: translateY(-2px); box-shadow: 0 6px 14px rgba(21,32,44,.14); }
  .brick .studs { background: inherit; border-color: inherit; position: absolute; top: -6px; left: 12px; display: flex; gap: 8px; }
  .brick .studs i { width: 16px; height: 6px; border-radius: 3px 3px 0 0; background: inherit; border: 1.5px solid; border-bottom: 0; border-color: inherit; display: block; }
  .brick .marks { margin-left: auto; display: flex; gap: 4px; align-items: center; }
  .ai { font-family: var(--f-mono); font-size: 9.5px; border: 1px solid currentColor; border-radius: 3px; padding: 0 3px; opacity: .75; line-height: 1.4; white-space: nowrap; }
  .ai.low { color: var(--amber); opacity: 1; }
  .s-sme .ai.low { color: #FFD48A; }
  .warn { color: var(--amber); font-size: 13px; line-height: 1; }
  .brick .txt { font-size: 13px; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  .brick.foot .txt, .brick.finding .txt, .brick.insight .txt { -webkit-line-clamp: 3; }
  .brick.two .txt { -webkit-line-clamp: 2; }
  .brick.insight .txt { font-weight: 600; font-size: 15px; line-height: 1.25; }
  .tags { margin-top: auto; display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
  .tag { font-size: 11px; font-weight: 600; padding: 1px 8px; border-radius: 999px; white-space: nowrap; background: var(--surface); }
  .tag.t-needs_check { border: 1px dashed var(--muted); }
  .tag.t-needs_changes { color: var(--amber); }
  .tag.t-disagreement { color: var(--red); }
  .tag.t-nothing { color: var(--amber); border: 1px solid var(--amber); background: transparent; }
  .brick.selected { outline: 3px solid var(--accent); outline-offset: 2px; }
  .canvas.exploring .brick:not(.near) { opacity: .25; }
  .canvas.exploring .stone:not(.near) { opacity: .3; }
  .canvas.connecting .brick { cursor: copy; }
  .canvas.connecting .brick.insight { opacity: .4; cursor: not-allowed; }

  /* Fill density says how checked it is */
  .s-checked_by_owner { background: var(--fill-owner); }
  .s-checked_by_peers { background: var(--fill-peers); border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); }
  .s-checked_by_sme { background: var(--fill-sme); border-color: var(--fill-sme); color: var(--on-sme); }
  .s-checked_by_sme .warn { color: #FFD48A; }
  .s-needs_check { background: transparent; border: 1.5px dashed var(--muted); }
  .s-needs_changes { background: var(--amber-bg); border-color: var(--amber); }
  .s-disagreement { background: var(--red-bg); border-color: var(--red); }
  .brick.glow { box-shadow: 0 0 0 2px var(--glow), 0 0 22px color-mix(in srgb, var(--glow) 55%, transparent); }
  .brick.fresh { animation: drop .45s cubic-bezier(.2,.9,.3,1.2); }
  @keyframes drop { from { transform: translateY(-18px); opacity: 0; } to { transform: none; opacity: 1; } }

  /* Base */
  .stone { position: absolute; background: var(--stone); border: 1px solid var(--slab-2); border-radius: 4px; padding: 7px 9px; font-size: 12px; line-height: 1.3; cursor: pointer; text-align: left; overflow: hidden; transition: opacity .15s; }
  .stone .n { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .stone.ai-text { border-style: dashed; }
  .slab-rest { position: absolute; right: 0; background: var(--slab-2); }
  .slab { position: absolute; left: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 3px; padding: 3px; background: var(--slab-2); }
  .part { background: var(--slab); border: 0; padding: 10px 12px; text-align: left; min-width: 0; font-weight: 700; font-size: 13.5px; }
  .part.gap { background: repeating-linear-gradient(135deg, var(--slab) 0 6px, transparent 6px 12px); outline: 1.5px dashed var(--muted); outline-offset: -4px; color: var(--muted); }
  .part.gap::after { content: " + add"; font-weight: 500; font-size: 12px; color: var(--amber); }

  .key { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); align-items: center; margin-top: 10px; }
  .key .sw { display: inline-block; width: 18px; height: 11px; border-radius: 2px; vertical-align: -1px; margin-right: 4px; border: 1.5px solid var(--line); }

  /* Connect bar */
  .connect { position: sticky; bottom: 12px; z-index: 5; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: var(--ink); color: var(--bg); padding: 10px 12px; border-radius: 12px; box-shadow: 0 8px 26px rgba(0,0,0,.25); }
  .connect input { flex: 1 1 240px; min-width: 0; padding: 7px 10px; border-radius: 7px; border: 0; background: var(--bg); color: var(--ink); }
  .connect .btn { box-shadow: none; }
  .connect .btn.ghost { color: var(--bg); border-color: transparent; }

  /* Review list */
  .filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .chipbtn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 12px; font-size: 13px; }
  .chipbtn[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .groups { display: flex; flex-direction: column; gap: 10px; }
  .group { background: var(--surface); border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; }
  .group > summary { list-style: none; display: flex; align-items: baseline; gap: 8px; padding: 12px 14px; font-weight: 700; font-size: 15px; cursor: pointer; }
  .group > summary::-webkit-details-marker { display: none; }
  .group > summary::before { content: "▸"; font-size: 11px; color: var(--muted); }
  .group[open] > summary::before { content: "▾"; }
  .group .count { font-family: var(--f-mono); font-weight: 400; font-size: 12px; color: var(--muted); }
  .group .empty { padding: 0 14px 14px; color: var(--muted); font-size: 13px; }
  .rrow { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: 4px 12px; align-items: start; width: 100%; text-align: left; background: none; border: 0; border-top: 1px solid var(--line); padding: 11px 14px; }
  .rrow:hover { background: var(--bg); }
  .rrow .st { font-size: 13.5px; }
  .rrow .mt { grid-column: 2; font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 2px 10px; }
  .rrow .tag { grid-row: 1; grid-column: 3; }
  .rrow .ok { grid-row: 1; grid-column: 3; font-size: 11.5px; color: var(--muted); white-space: nowrap; }
  .amber { color: var(--amber); }
  .shape { width: 12px; height: 12px; margin-top: 4px; display: block; border: 1.5px solid var(--ink); }
  .shape.observation { border-radius: 1px; }
  .shape.finding { border-radius: 50%; border-style: dashed; }
  .shape.insight { transform: rotate(45deg) scale(.85); }

  /* Panel */
  .panel { border-left: 1px solid var(--line); background: var(--surface); padding: 18px 18px 28px; overflow-y: auto; max-height: 100vh; position: sticky; top: 0; display: flex; flex-direction: column; gap: 16px; }
  .panel > * { flex-shrink: 0; }
  .panel-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  .panel h2 { font-size: 19px; line-height: 1.25; margin: 2px 0 0; font-weight: 700; text-wrap: balance; }
  .panel h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 6px; font-weight: 600; }
  .x { border: 0; background: none; font-size: 20px; line-height: 1; color: var(--muted); padding: 2px 6px; }
  .meta { color: var(--muted); font-size: 12.5px; }
  .status { font-weight: 600; color: var(--ink); }
  .status.t-needs_changes { color: var(--amber); } .status.t-disagreement { color: var(--red); }
  .under { display: flex; flex-direction: column; gap: 6px; }
  .under-item { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--bg); text-align: left; display: flex; flex-direction: column; gap: 3px; }
  .under-item .q { font-size: 12.5px; white-space: pre-line; }
  .under-item .q mark { background: color-mix(in srgb, var(--glow) 40%, transparent); color: inherit; padding: 0 2px; }
  .under-item .r { font-size: 11.5px; color: var(--muted); }
  .under-item .r.bad { color: var(--amber); }
  .aisays { border: 1.5px dashed var(--line); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
  .aisays .conf { font-weight: 700; }
  .aisays .conf.low { color: var(--amber); }
  .aisays ul { margin: 0; padding-left: 18px; font-size: 12.5px; }
  .verdicts { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 6px; }
  .verdicts .btn { padding: 9px 6px; font-weight: 600; white-space: normal; }
  .verdicts .btn[aria-pressed="true"] { color: var(--bg); }
  .v-needs_changes { color: var(--amber); } .v-disagree { color: var(--red); }
  .hows { display: flex; flex-wrap: wrap; gap: 6px; }
  .hows button { border: 1px solid var(--line); background: none; border-radius: 999px; padding: 3px 10px; font-size: 12px; }
  .hows button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .panel textarea, .panel input[type="text"], .panel select { width: 100%; padding: 8px 10px; border-radius: 7px; border: 1px solid var(--line); background: var(--bg); resize: vertical; }
  .panel details summary { cursor: pointer; font-size: 12.5px; color: var(--muted); }
  .checks { display: flex; flex-direction: column; gap: 6px; font-size: 12.5px; margin-top: 8px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .stack { display: flex; flex-direction: column; gap: 8px; }
  .prompt { font-family: var(--f-mono); font-size: 11.5px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .pkg-item { border-top: 1px solid var(--line); padding-top: 10px; display: flex; flex-direction: column; gap: 4px; }
  .pkg-item .t { font-weight: 600; font-size: 16px; line-height: 1.25; }
  .toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: 13px; z-index: 50; max-width: calc(100% - 32px); }
  .toast.err { background: var(--red); color: #fff; }

  @media (max-width: 900px) {
    .app, .app.panel-open { grid-template-columns: minmax(0, 1fr); }
    .bar, .main { padding-left: 16px; padding-right: 16px; }
    .nav .later { display: none; }
    h1 { font-size: 22px; }
    .part { font-size: 12px; padding: 8px; }
    .panel { position: fixed; left: 0; right: 0; bottom: 0; top: auto; max-height: 78vh; border-left: 0; border-top: 1px solid var(--line); border-radius: 16px 16px 0 0; box-shadow: 0 -10px 30px rgba(0,0,0,.25); z-index: 40; padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px)); }
  }
  @media (prefers-reduced-motion: reduce) { .brick, .brick.fresh { transition: none; animation: none; } }
</style>
</head>
<body>
<div class="app" id="app">
  <div class="col">
    <header class="bar">
      <a class="brand" href="#">ANCHOR</a>
      <nav class="nav" aria-label="Main">
        <a href="#">Workspaces</a>
        <span class="later" title="Coming later">Decisions · Narratives · Requests <small>(later)</small></span>
      </nav>
      <label class="who">You are <select id="me" aria-label="You are"></select></label>
    </header>
    <main class="main" id="main"><div class="loading">Loading...</div></main>
  </div>
  <aside class="panel" id="panel" hidden></aside>
</div>

<script>
// ---------- Words (docs/GLOSSARY.md) ----------
const LEVEL = { observation: "Observation", finding: "Finding", insight: "Insight" };
const NEXT = { observation: "finding", finding: "insight" };
const ROW = [["insight", "Insights"], ["finding", "Findings"], ["observation", "Observations"]];
const UNCHECKED = new Set(["needs_check", "needs_changes", "disagreement"]);
const VERDICT = { looks_right: "Looks right", needs_changes: "Needs changes", disagree: "Disagree" };
const REVIEW_SAID = { approve: "Looks right", changes: "Needs changes", disagree: "Disagree" };
const TAG = { needs_check: "Needs a check", needs_changes: "Needs changes", disagreement: "Disagree" };
const SAMPLE_AI_TEXT = `Checkout summary (drafted by an AI assistant)

Mobile checkout conversion is 42 percent, well below desktop.
Most shoppers leave because the address form is too long.
Returning shoppers clearly convert better because they trust the brand.
Adding Apple Pay would likely fix the rest of the drop-off.
We should prioritize autofill and Apple Pay in Q3.`;

// ---------- State ----------
const S = {
  me: null, people: [], config: null,
  ws: null, view: "build", selected: new Set(), connecting: false,
  panel: null, detail: null, verdict: null, how: null, queueMode: false,
  fresh: new Set(), filter: "all", mine: false,
};

// ---------- Helpers ----------
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const plural = (n, w) => n + " " + w + (n === 1 ? "" : "s");
const isPhone = () => window.matchMedia("(max-width: 900px)").matches;
const byId = id => S.ws?.blocks.find(b => b.id === id);
const srcById = id => S.ws?.sources.find(s => s.id === id);
const isSme = name => S.people.find(p => p.name === name)?.sme;
const madeWithAI = b => b.origin !== "person";
const originText = b => b.origin === "ai_agent" ? "AI draft for " + b.owner : b.origin === "person_with_ai" ? b.owner + " with AI" : b.owner;
const tag = st => TAG[st] ? `<span class="tag t-${st}">${TAG[st]}</span>` : "";

async function api(path, body) {
  const res = await fetch("/api/" + path, body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : {});
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || "Something went wrong");
  return data;
}
function toast(msg, err) {
  document.querySelectorAll(".toast").forEach(x => x.remove());
  const t = document.createElement("div");
  t.className = "toast" + (err ? " err" : ""); t.textContent = msg; t.setAttribute("role", "status");
  document.body.appendChild(t); setTimeout(() => t.remove(), err ? 4200 : 2400);
}
async function run(fn) { try { return await fn(); } catch (e) { toast(e.message, true); } }
function copy(text, done) {
  const ok = () => toast(done || "Copied.");
  (navigator.clipboard?.writeText(text) || Promise.reject()).then(ok, () => toast("Copy did not work here. Select the text and copy it.", true));
}

// ---------- Routing ----------
function route() {
  const m = location.hash.match(/^#w\/(\d+)/);
  closePanel(true);
  S.selected.clear(); S.connecting = false;

// ---------- Build view ----------
const W = { observation: 156, finding: 240, insight: 280, stone: 140 };
const H = { observation: 118, finding: 108, insight: 112, stone: 50 };
const GAP = 16;

// Lay out one row left to right near where each item wants to be, without
// overlaps. Items with nothing under them (want is null) go at the end.
function spread(items, minX) {
  items.sort((a, b) => (a.want ?? Infinity) - (b.want ?? Infinity));
  let edge = minX;
  items.forEach(it => { it.x = it.want == null ? edge : Math.max(it.want - it.w / 2, edge); edge = it.x + it.w + GAP; });
  return items;
}

function layout() {
  const blocks = S.ws.blocks;
  const findings = blocks.filter(b => b.level === "finding");
  const insights = blocks.filter(b => b.level === "insight");
  // Put observations under what they hold up, so the wires stay short.
  const order = [];
  [...insights.flatMap(i => i.built_on.map(byId).filter(Boolean)), ...findings].forEach(f => {
    if (f.level !== "finding") return;
    f.built_on.forEach(id => { const b = byId(id); if (b && b.level === "observation" && !order.includes(b)) order.push(b); });
  });
  blocks.filter(b => b.level === "observation" && !order.includes(b)).forEach(b => order.push(b));

  const pad = 24, pos = {};
  order.forEach((b, i) => { pos[b.id] = { x: pad + i * (W.observation + GAP), w: W.observation, h: H.observation }; });
  const cx = id => pos[id] ? pos[id].x + pos[id].w / 2 : null;
  const avg = arr => { const v = arr.filter(x => x != null); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; };
  for (const [level, list] of [["finding", findings], ["insight", insights]])
    spread(list.map(b => ({ id: b.id, want: avg(b.built_on.map(cx)), w: W[level] })), pad).forEach(it => pos[it.id] = { x: it.x, w: it.w, h: H[level] });
  const srcCenters = s => order.filter(b => b.source_ids.includes(s.id)).map(b => cx(b.id));
  spread(S.ws.sources.map(s => ({ id: "s" + s.id, want: avg(srcCenters(s)), w: W.stone })), pad).forEach(it => pos[it.id] = { x: it.x, w: it.w, h: H.stone });
  const right = Math.max(600, ...Object.values(pos).map(p => p.x + p.w)) + 30;
  return { pos, width: right };
}

function renderBuild() {
  const view = $("view");
  view.innerHTML = `<div class="canvas-wrap" id="canvas-wrap"><div class="canvas" id="canvas"></div></div>
    <div class="key"><span>Fuller means more checked:</span>
      <span><i class="sw" style="border-style:dashed;background:transparent;border-color:var(--muted)"></i>not yet</span>
      <span><i class="sw" style="background:var(--fill-owner)"></i>owner</span>
      <span><i class="sw" style="background:var(--fill-peers)"></i>peers</span>
      <span><i class="sw" style="background:var(--fill-sme);border-color:var(--fill-sme)"></i>SME</span>
      <span>· ⚠ built on something unchecked · Hover a block to trace it.</span></div>`;
  const canvas = $("canvas"), wrap = $("canvas-wrap");
  const { pos, width } = layout();
  const availPx = wrap.clientWidth || 900;
  const scale = Math.max(isPhone() ? .8 : .72, Math.min(1, availPx / width));
  const avail = availPx / scale;
  const W_ = Math.max(avail, width);
  const shift = width < avail ? (avail - width) / 2 : 0;
  const Y = { insight: 34, finding: 214, observation: 388, stone: 574, slab: 640 };
  const totalH = Y.slab + 46;
  canvas.style.zoom = scale;
  canvas.style.width = W_ + "px";
  canvas.style.height = totalH + "px";
  canvas.classList.toggle("connecting", S.connecting);
  const X = id => pos[id].x + shift;

  let html = ROW.map(([k, l]) => `<div class="row-label" style="top:${Y[k] - 22}px">${l}</div>`).join("")
    + `<div class="row-label" style="top:${Y.stone - 22}px">Base</div>`;
  let wires = "";
  const top = (id, y) => ({ x: X(id) + pos[id].w / 2, y });
  const bottom = (id, y) => ({ x: X(id) + pos[id].w / 2, y: y + pos[id].h });
  const curve = (a, b) => { const m = (a.y + b.y) / 2; return `M${a.x},${a.y} C${a.x},${m} ${b.x},${m} ${b.x},${b.y}`; };
  S.ws.blocks.forEach(b => {
    b.built_on.forEach(cid => {
      const c = byId(cid); if (!c || !pos[cid]) return;
      wires += `<path class="wire${UNCHECKED.has(c.check.state) ? " weak" : ""}" data-a="${b.id}" data-b="${cid}" d="${curve(top(cid, Y[c.level]), bottom(b.id, Y[b.level]))}"/>`;
    });
    if (b.level === "observation") b.source_ids.forEach(sid => {
      if (pos["s" + sid]) wires += `<path class="wire src" data-a="${b.id}" data-b="s${sid}" d="${curve(top("s" + sid, Y.stone), bottom(b.id, Y.observation))}"/>`;
    });
  });
  html += `<svg class="wires" width="${W_}" height="${totalH}" viewBox="0 0 ${W_} ${totalH}" aria-hidden="true">${wires}</svg>`;

  S.ws.blocks.forEach(b => {
    const p = pos[b.id]; if (!p) return;
    const st = b.check.state;
    const tags = tag(st) + (b.rests_on_nothing ? `<span class="tag t-nothing">Rests on nothing</span>` : "");
    const cls = ["brick", b.level, "s-" + st];
    if (TAG[st] && b.rests_on_nothing) cls.push("two");
    else if (tags || madeWithAI(b) || b.unchecked_parts) cls.push("foot");
    if (S.selected.has(b.id)) cls.push("selected");
    if (b.level === "insight" && ["checked_by_peers", "checked_by_sme"].includes(st)) cls.push("glow");
    if (S.fresh.has(b.id)) cls.push("fresh");
    const marks = (madeWithAI(b) ? `<span class="ai${b.confidence === "low" ? " low" : ""}" title="Made with AI${b.confidence ? ", " + b.confidence + " confidence" : ""}">AI${b.confidence === "low" ? " · low" : ""}</span>` : "")
      + (b.unchecked_parts ? `<span class="warn" title="Built on ${plural(b.unchecked_parts, "block")} that still ${b.unchecked_parts === 1 ? "needs" : "need"} a check">⚠</span>` : "");
    html += `<div class="${cls.join(" ")}" role="button" tabindex="0" data-id="${b.id}" style="left:${X(b.id)}px;top:${Y[b.level]}px;width:${p.w}px;height:${p.h}px" aria-label="${LEVEL[b.level]}: ${esc(b.statement)}. ${b.check.label}">
      <div class="studs">${"<i></i>".repeat({ observation: 2, finding: 4, insight: 5 }[b.level])}</div>
      <div class="txt">${esc(b.statement)}</div>
      ${tags || marks ? `<div class="tags">${tags}<span class="marks">${marks}</span></div>` : ""}
    </div>`;
  });
  S.ws.sources.forEach(s => {
    html += `<button class="stone${s.kind === "ai_text" ? " ai-text" : ""}" data-src="${s.id}" style="left:${X("s" + s.id)}px;top:${Y.stone}px;width:${W.stone}px;height:${H.stone}px" title="${esc(s.kind)}: ${esc(s.title)}"><span class="n">${esc(s.title)}</span></button>`;
  });
  const slabW = Math.min(W_, avail);
  if (W_ > slabW) html += `<div class="slab-rest" style="top:${Y.slab}px;height:46px;left:${slabW}px"></div>`;
  html += `<div class="slab" style="top:${Y.slab}px;height:46px;width:${slabW}px">${S.ws.base.map(p =>
    `<button class="part${p.ok ? "" : " gap"}" data-part="${p.key}">${esc(p.label)}</button>`).join("")}</div>`;
  canvas.innerHTML = html;
  // Bring new blocks into view, for example after breaking down AI text.
  const fresh = [...S.fresh].filter(id => pos[id]).map(id => X(id));
  if (fresh.length) wrap.scrollLeft = Math.max(0, (Math.min(...fresh) - 40) * scale);
  S.fresh.clear();
  highlight();
}

// Trace a block's whole line: what it rests on, and what rests on it.
function below(id, out = new Set()) { (byId(id)?.built_on || []).forEach(x => { if (!out.has(x)) { out.add(x); below(x, out); } }); return out; }
function above(id, out = new Set()) { S.ws.blocks.filter(b => b.built_on.includes(id)).forEach(p => { if (!out.has(p.id)) { out.add(p.id); above(p.id, out); } }); return out; }
function trace(id) {
  const canvas = $("canvas"); if (!canvas) return;
  const clear = () => { canvas.classList.remove("exploring"); canvas.querySelectorAll(".near").forEach(e => e.classList.remove("near")); canvas.querySelectorAll(".wire.hot").forEach(e => e.classList.remove("hot")); };
  if (!id || !byId(id)) return clear();
  const set = new Set([id, ...below(id), ...above(id)]);
  const srcs = new Set([...set].flatMap(x => (byId(x)?.source_ids || []).map(s => "s" + s)));
  canvas.classList.add("exploring");
  canvas.querySelectorAll(".brick").forEach(el => el.classList.toggle("near", set.has(+el.dataset.id)));
  canvas.querySelectorAll(".stone").forEach(el => el.classList.toggle("near", srcs.has("s" + el.dataset.src)));
  canvas.querySelectorAll(".wire").forEach(w => w.classList.toggle("hot", set.has(+w.dataset.a) && (set.has(+w.dataset.b) || srcs.has(w.dataset.b))));
}
function highlight() { if (S.view === "build") trace(S.panel?.type === "block" ? S.panel.id : null); }

// ---------- Review view ----------
function renderReview() {
  const list = S.ws.blocks.filter(b => (S.filter === "all" || b.level === S.filter) && (!S.mine || b.owner === S.me));
  const needs = list.filter(b => b.check.state === "needs_check");
  const attn = list.filter(b => ["needs_changes", "disagreement"].includes(b.check.state) || (b.rests_on_nothing && b.check.state !== "needs_check"));
  const ok = list.filter(b => !needs.includes(b) && !attn.includes(b));
  const row = b => {
    const st = b.check.state;
    const on = b.level === "observation" ? plural(b.source_ids.length, "source") : plural(b.built_on.length, "block");
    return `<button class="rrow" data-open="${b.id}">
      <i class="shape ${b.level}" title="${LEVEL[b.level]}"></i>
      <span class="st">${esc(b.statement)}</span>
      ${TAG[st] ? tag(st) : `<span class="ok">✓ ${esc(b.check.label.replace("Checked by ", ""))}</span>`}
      <span class="mt"><span>${LEVEL[b.level]}</span><span>${originText(b)}</span>
        ${b.confidence ? `<span class="${b.confidence === "low" ? "amber" : ""}">AI says ${b.confidence}</span>` : ""}
        ${b.rests_on_nothing ? `<span class="amber">Rests on nothing</span>` : `<span>Built on ${on}${b.unchecked_parts ? ` <span class="amber">⚠ ${b.unchecked_parts} unchecked</span>` : ""}${b.deep_unchecked ? ` · ${b.deep_unchecked} further down` : ""}</span>`}
        ${b.assumes.length ? `<span>Assumes ${plural(b.assumes.length, "thing")}</span>` : ""}</span>
    </button>`;
  };
  const group = (title, items, open, empty) => `<details class="group"${open ? " open" : ""}><summary>${title} <span class="count">${items.length}</span></summary>${items.length ? items.map(row).join("") : `<div class="empty">${empty}</div>`}</details>`;
  $("view").innerHTML = `<div class="filters">
      ${[["all", "All"], ["observation", "Observations"], ["finding", "Findings"], ["insight", "Insights"]].map(([k, l]) => `<button class="chipbtn" data-filter="${k}" aria-pressed="${S.filter === k}">${l}</button>`).join("")}
      <button class="chipbtn" data-mine aria-pressed="${S.mine}">Mine</button>
    </div>
    <div class="groups">
      ${group("Needs a check", needs, true, "Nothing waiting.")}
      ${group("Needs attention", attn, true, "No changes asked for, no disagreements, and nothing resting on nothing.")}
      ${group("Checked", ok, false, "Nothing checked yet.")}
    </div>`;
}

async function renderPanel() {

    : p.type === "breakdown" ? panelBreakdown()

const head = (eyebrow, title) => `<div class="panel-head"><div><div class="eyebrow">${eyebrow}</div><h2>${esc(title)}</h2></div><button class="x" data-close aria-label="Close">×</button></div>`;

function quoteFor(body, text) {
  const words = new Set(text.toLowerCase().match(/[a-z]{5,}/g) || []);
  return body.split("\n").map(line => {
    const hit = (line.toLowerCase().match(/[a-z]{5,}/g) || []).some(w => [...words].some(x => x.slice(0, 5) === w.slice(0, 5)));
    return hit ? `<mark>${esc(line)}</mark>` : esc(line);
  }).join("\n");
}

function panelBlock(d) {
  const b = byId(d.id) || d;
  const st = d.check.state, mine = d.owner === S.me;
  let h = head(LEVEL[d.level] + (S.queueMode ? ` · ${S.queue.length} to check` : ""), d.statement);
  h += `<div class="meta"><span class="status t-${st}">${esc(d.check.label)}</span> · ${originText(d)}</div>`;

  // What it rests on
  h += `<div><h3>${d.level === "observation" ? "From" : "Built on"}</h3><div class="under">`;
  if (d.level === "observation") d.sources.forEach(s => {
    h += `<button class="under-item" data-open-src="${s.id}"><span class="r">${esc(s.title)}</span><span class="q">${quoteFor(s.body, d.statement)}</span></button>`;
  });
  else (b.built_on || []).map(byId).filter(Boolean).forEach(c => {
    const bad = UNCHECKED.has(c.check.state);
    h += `<button class="under-item" data-open="${c.id}"><span class="q">${esc(c.statement)}</span><span class="r${bad ? " bad" : ""}">${bad ? "⚠ " : ""}${esc(c.check.label)}</span></button>`;
  });
  if (d.rests_on_nothing) h += `<div class="note amber">Nothing is under this yet. ${d.level === "observation" ? "Which source did it come from?" : "Which blocks show it? Use Connect to build it from them."}</div>`;
  h += `</div>${d.unchecked_parts ? `<div class="note" style="margin-top:6px">You can still build on this. It stays flagged until ${d.unchecked_parts === 1 ? "that block is" : "those blocks are"} checked.</div>` : ""}</div>`;

  // What the AI said, kept apart from any check
  if (madeWithAI(d)) {
    h += `<div class="aisays"><h3 style="margin:0">AI says</h3>`
      + (d.confidence ? `<div><span class="conf ${d.confidence}">${d.confidence[0].toUpperCase() + d.confidence.slice(1)} confidence</span>${d.why ? ` · ${esc(d.why)}` : ""}</div>` : `<div class="amber">${esc(d.why || "The AI did not say how sure it was, or why.")}</div>`)
      + (d.assumes.length ? `<div class="note">Assumes</div><ul>${d.assumes.map(a => `<li>${esc(a)}</li>`).join("")}</ul>` : "")
      + `<div class="note">This is the AI's own view. It never counts as a check.</div></div>`;
  }

  // The checkpoint
  h += `<div><h3>Your check</h3>`;
  if (mine) {
    const intro = d.stage === "draft" ? "An AI drafted this for you. Read it against what it rests on, fix the wording if needed, then stand behind it."
      : st === "needs_changes" ? "Changes were asked for. Change the wording to answer them. This saves a new version and keeps the old one."
      : "You stand behind this. Someone else can check it next. To change it, edit the wording to save a new version.";
    h += `<div class="note" style="margin-bottom:8px">${intro}</div>
      <textarea id="edit-text" rows="3" aria-label="Wording">${esc(d.statement)}</textarea>
      <input type="text" id="check-note" placeholder="What did you check or change? (optional)" style="margin-top:8px" aria-label="Note">
      <div class="row" style="margin-top:8px"><button class="btn primary" data-save="owner">${d.stage === "draft" ? "Looks right" : "Save new version"}</button>${S.queueMode ? `<button class="btn ghost" data-skip>Skip</button>` : ""}</div>`;
  } else if (d.stage === "draft") {
    h += `<div class="note">${esc(d.owner)} checks this AI draft first. Then it is open for anyone to check.</div>${S.queueMode ? `<div class="row" style="margin-top:8px"><button class="btn ghost" data-skip>Skip</button></div>` : ""}`;
  } else {
    h += `<div class="verdicts">${Object.entries(VERDICT).map(([k, v]) => `<button class="btn v-${k}" data-verdict="${k}" aria-pressed="${S.verdict === k}">${v}</button>`).join("")}</div>`;
    if (S.verdict) {
      const checks = S.config?.checks || {};
      h += `<div class="stack" style="margin-top:12px">
        ${S.verdict === "looks_right" ? `<div class="note">How did you check? (optional)</div><div class="hows">${Object.entries(checks).map(([k, v]) => `<button data-how="${k}" aria-pressed="${S.how === k}">${esc(v)}</button>`).join("")}</div>` : ""}
        <input type="text" id="check-note" placeholder="${S.verdict === "looks_right" ? "Add a note (optional)" : S.verdict === "needs_changes" ? "What should change?" : "Why do you disagree?"}" aria-label="Note">
        <div class="row"><button class="btn primary" data-save="${S.verdict}">Save check</button>${S.queueMode ? `<button class="btn ghost" data-skip>Skip</button>` : ""}</div>
      </div>`;
    } else if (S.queueMode) h += `<div class="row" style="margin-top:8px"><button class="btn ghost" data-skip>Skip</button></div>`;
  }
  h += `</div>`;

  if (d.level === "insight") {
    const inPkg = S.ws.package.includes(d.id);
    h += `<div class="row">${inPkg ? `<button class="btn" data-unpkg="${d.id}">Remove from package</button>` : `<button class="btn" data-pkg="${d.id}">Add to package</button>`}</div>`;
  }

  const ups = S.ws.blocks.filter(x => x.built_on.includes(d.id));
  if (ups.length) h += `<details><summary>Holds up ${ups.length}</summary><div class="under" style="margin-top:8px">${ups.map(u => `<button class="under-item" data-open="${u.id}"><span class="q">${esc(u.statement)}</span><span class="r">${LEVEL[u.level]}</span></button>`).join("")}</div></details>`;
  const history = [];
  if (d.confirmed) history.push(`<div><b>Checked by owner</b> · ${esc(d.confirmed.by)}${d.confirmed.edited ? ` · changed the AI's wording<br><span class="meta">AI wrote: "${esc(d.confirmed.before)}"</span>` : ""}${d.confirmed.note ? `<br><span class="meta">${esc(d.confirmed.note)}</span>` : ""}</div>`);
  d.reviews.forEach(r => history.push(`<div><b class="${r.verdict === "changes" ? "amber" : ""}" style="${r.verdict === "disagree" ? "color:var(--red)" : ""}">${r.current ? "" : "<s>"}${REVIEW_SAID[r.verdict]}${r.current ? "" : "</s>"}</b> · ${esc(r.by)}${r.sme ? " (SME)" : ""}${r.how ? " · " + esc((S.config?.checks || {})[r.how] || r.how).toLowerCase() : ""}${r.note ? `<br><span class="meta">${esc(r.note)}</span>` : ""}</div>`));
  if (d.revises) history.push(`<div><b>New version</b> of <button class="linkbtn" data-open-any="${d.revises.id}">an earlier wording</button><br><span class="meta">"${esc(d.revises.statement)}"</span></div>`);
  if (history.length) h += `<details${S.queueMode ? "" : ""}><summary>History ${history.length}</summary><div class="checks">${history.join("")}</div></details>`;
  return h;
}

function panelPart(key) {
  const ws = S.ws;
  const part = ws.base.find(p => p.key === key);
  let h = head("Base", part.label);
  if (key === "question") {
    h += `<label class="stack"><h3>Question</h3><textarea id="f-question" rows="2">${esc(ws.question)}</textarea></label>
      <label class="stack"><h3>Decision it serves</h3><textarea id="f-decision" rows="2">${esc(ws.decision || "")}</textarea></label>`;
  } else if (key === "method") {
    h += `<div class="note">How the work was done, so a checker can judge what it can and cannot show.</div><textarea id="f-method" rows="4" aria-label="Method">${esc(ws.method || "")}</textarea>`;
  } else if (key === "notes") {
    h += `<div class="note">What a checker should know: when it ran, what was left out, known gaps.</div><textarea id="f-notes" rows="5" aria-label="Notes">${esc(ws.notes || "")}</textarea>`;
  } else {
    h += `<div class="note">Everything observations come from. ${ws.sources.length < 2 ? "Add at least two sources for a solid base." : ""}</div>`;
    h += `<div class="under">${ws.sources.map(s => `<button class="under-item" data-open-src="${s.id}"><span class="q">${esc(s.title)}</span><span class="r">${esc(s.kind === "ai_text" ? "AI text" : s.kind)} · ${esc(s.added_by)}</span></button>`).join("")}</div>`;
    h += `<details open><summary>Add a source</summary><div class="stack" style="margin-top:8px">
      <select id="n-kind" aria-label="Kind"><option value="note">Note</option><option value="quote">Quote</option><option value="data">Data</option><option value="query">Query</option><option value="link">Link</option><option value="file">File text</option></select>
      <input type="text" id="n-title" placeholder="Title" aria-label="Title">
      <textarea id="n-body" rows="4" placeholder="Paste the text, data, or query" aria-label="Content"></textarea>
      <div class="row"><button class="btn" id="add-src">Add source</button></div></div></details>`;
    h += `<div><h3>Draft observations with your AI</h3>
      <div class="note" style="margin-bottom:8px">Your AI tool reads this workspace over MCP and adds drafts, each with how sure it is and why. You check each one.</div>
      <button class="btn" id="copy-obs-prompt">Copy prompt for your AI</button></div>`;
  }
  if (key !== "context") h += `<div class="row"><button class="btn primary" id="save-part" data-key="${key}">Save</button></div>`;
  return h;
}

function panelSource(s) {
  const uses = S.ws.blocks.filter(b => b.source_ids.includes(s.id));
  let h = head("Source · " + (s.kind === "ai_text" ? "AI text" : s.kind), s.title);
  h += `<div class="prompt">${esc(s.body)}</div><div class="meta">Added by ${esc(s.added_by)}${s.url ? ` · <a href="${esc(s.url)}" target="_blank" rel="noopener">link</a>` : ""}</div>`;
  h += `<div><h3>Observations from this</h3><div class="under">${uses.length ? uses.map(u => `<button class="under-item" data-open="${u.id}"><span class="q">${esc(u.statement)}</span><span class="r${UNCHECKED.has(u.check.state) ? " bad" : ""}">${esc(u.check.label)}</span></button>`).join("") : `<div class="note">None yet.</div>`}</div></div>`;
  return h;
}

function panelBreakdown() {
  let h = head("Break down AI text", "Take a long AI answer apart");
  h += `<div class="note">Long AI text can hide assumptions. Paste it here and ANCHOR splits it into one draft block per claim. Claims with nothing under them show up, and words like "most" or "clearly" are listed as assumptions. Nothing leaves this app.</div>
    <input type="text" id="bd-title" placeholder="Title, for example: AI summary of the interviews" aria-label="Title">
    <textarea id="bd-text" rows="9" placeholder="Paste AI text here" aria-label="AI text"></textarea>
    <div class="row"><button class="btn primary" id="bd-run">Split into blocks</button><button class="linkbtn" id="bd-sample">Try a sample</button></div>
    <div id="bd-result"></div>
    <div><h3>Or let your AI tool do it</h3><div class="note" style="margin-bottom:8px">It does a smarter split over MCP: each block cites a source, is built on the right parts, and says how sure the AI is and why.</div>
    <button class="btn" id="bd-prompt">Copy prompt for your AI</button></div>`;
  return h;
}

function panelPackage() {
  const items = S.ws.package.map(byId).filter(Boolean);
  let h = head("Package", S.ws.question);
  h += `<div class="note">The insights this workspace shares together. Each shows what it rests on, down to the sources.</div>`;
  const leaves = id => new Set([id, ...below(id)].filter(x => byId(x)?.level === "observation"));
  items.forEach(b => {
    const lv = [...leaves(b.id)].map(byId);
    const srcs = new Set(lv.flatMap(o => o.source_ids));
    const weak = [...below(b.id)].filter(x => UNCHECKED.has(byId(x)?.check.state)).length;
    h += `<div class="pkg-item"><div class="t">${esc(b.statement)}</div>
      <div class="meta">${esc(b.check.label)}</div>
      <div class="meta">Rests on ${plural(b.built_on.length, "block")}, ${plural(lv.length, "observation")}, ${plural(srcs.size, "source")}.${weak ? ` <span class="amber">${weak} still need a check.</span>` : " All checked."}</div>
      <div><button class="linkbtn" data-open="${b.id}">Open</button></div></div>`;
  });
  for (let i = 0; i < items.length; i++) for (let j = i + 1; j < items.length; j++) {
    const a = leaves(items[i].id), c = leaves(items[j].id);
    const shared = [...a].filter(x => c.has(x)).length;
    if (shared) h += `<div class="note">"${esc(items[i].statement)}" and "${esc(items[j].statement)}" rest on ${plural(shared, "shared observation")}.</div>`;
  }
  h += `<div class="note" style="border-top:1px solid var(--line);padding-top:10px">Next: a narrative that turns this package into a story you can follow back to the parts. Coming later.</div>`;
  return h;
}

// ---------- Prompts for the person's own AI tool ----------
const obsPrompt = () => `Use the ANCHOR prompt "break_down_text", or: call get_workspace(study_id=${S.ws.id}) and read every source. Write observations: only what was seen or measured, one claim each, citing the source id. Then findings built on them, then insights built on findings. Give every block confidence (low, medium, high), why in one line, and what it assumes. Add them with add_blocks as drafts for me to check.`;
const breakdownPrompt = text => `Take this AI text apart into building blocks in ANCHOR workspace ${S.ws.id}. Call add_source with it (kind "ai_text"), then add_blocks: one claim per block, observations citing sources, findings and insights built on the blocks that show them. Give every block confidence (low, medium, high), why, and what it assumes. Tell me which claims rest on nothing.\n\n${text || "<paste the text here>"}`;
const connectPrompt = (ids, target) => `In ANCHOR workspace ${S.ws.id}, read blocks ${ids.map(i => "#" + i).join(", ")} with get. Write one ${target} they add up to, as one sentence. Add it with add(level="${target}", evidence=[${ids.join(", ")}], study_id=${S.ws.id}, origin="person_with_ai") and give confidence, why, and what it assumes.`;

// ---------- Actions ----------
async function saveCheck(verdict) {
  const d = S.detail;
  const note = $("check-note")?.value.trim() || null;
  const body = { learning_id: d.id, by: S.me, note };
  if (verdict === "owner") {
    body.verdict = "looks_right";
    body.statement = $("edit-text").value.trim();
    if (d.stage !== "draft" && body.statement === d.statement) return toast("Change the wording first, or leave it as it is.", true);
  } else {
    body.verdict = verdict;
    body.how = verdict === "looks_right" ? S.how : null;
    if (verdict !== "looks_right" && !note) { $("check-note").focus(); return toast("Add a short reason first.", true); }
  }
  const out = await run(() => api("check", body));
  if (!out) return;
  toast(out.learning.check.label + ".");
  const queueMode = S.queueMode;
  await openWorkspace(S.ws.id);
  if (queueMode && S.queue.length) { S.queueMode = true; await openPanel({ type: "block", id: S.queue.find(i => i.id !== d.id)?.id || S.queue[0].id }); }
  else if (queueMode) { toast("All checked."); closePanel(); }
  else await openPanel({ type: "block", id: out.learning.id });
}

async function setPackage(ids) {
  const out = await run(() => api("set_package", { study_id: S.ws.id, by: S.me, learning_ids: ids }));
  if (!out) return;
  if (out.warnings.length) toast("In the package. Note: " + out.warnings.join(", ") + ".");
  await reload();
}

async function connect() {
  const input = $("connect-text");
  const sel = [...S.selected];
  const target = $("connect-add").dataset.target;
  const text = input.value.trim();
  if (!text) { input.focus(); return toast("Write one sentence first, or copy the prompt for your AI.", true); }
  const out = await run(() => api("add", { statement: text, level: target, owner: S.me, evidence: sel, study_id: S.ws.id }));
  if (!out) return;
  S.selected.clear(); S.connecting = false; S.fresh.add(out.learning.id);
  await openWorkspace(S.ws.id);
  await openPanel({ type: "block", id: out.learning.id });
}

async function breakDown() {
  const text = $("bd-text").value.trim();
  if (!text) { $("bd-text").focus(); return toast("Paste some AI text first.", true); }
  const out = await run(() => api("break_down", { study_id: S.ws.id, by: S.me, text, title: $("bd-title").value.trim() || null }));
  if (!out) return;
  out.ids.forEach(i => S.fresh.add(i));
  const nothing = out.blocks.filter(b => b.rests_on_nothing).length;
  const assumed = out.blocks.filter(b => b.assumes.length).length;
  await openWorkspace(S.ws.id, true);
  $("bd-result").innerHTML = `<div class="stack"><div><b>Made ${plural(out.blocks.length, "draft block")}.</b> ${nothing ? `<span class="amber">${nothing} rest on nothing in the text.</span>` : ""} ${assumed ? `${assumed} take something as given.` : ""}</div>
    <div class="under">${out.blocks.map(b => `<button class="under-item" data-open="${b.id}"><span class="q">${esc(b.statement)}</span><span class="r${b.rests_on_nothing ? " bad" : ""}">${LEVEL[b.level]}${b.rests_on_nothing ? " · rests on nothing" : ""}${b.assumes.length ? " · assumes " + plural(b.assumes.length, "thing") : ""}</span></button>`).join("")}</div>
    <div class="note">They are drafts owned by you. Check each one: fix the level or wording, and connect findings to what shows them.</div></div>`;
}

function setView(v) {
  S.view = v;
  if (v !== "build") { S.connecting = false; S.selected.clear(); }
  renderWorkspace();
}

// ---------- Events ----------
document.addEventListener("submit", async e => {
  if (e.target.id !== "new-ws") return;
  e.preventDefault();
  const out = await run(() => api("start_study", { question: $("nw-q").value.trim(), owner: S.me, decision: $("nw-d").value.trim() || null }));
  if (out) location.hash = "#w/" + out.study.id;
});

document.addEventListener("click", async e => {
  const t = e.target.closest("button, .brick");
  if (!t) return;
  if (t.classList.contains("brick")) {
    const id = +t.dataset.id;
    if (S.connecting) {
      if (byId(id).level === "insight") return toast("Insights are the top. Pick observations or findings.");
      S.selected.has(id) ? S.selected.delete(id) : S.selected.add(id);
      renderConnect(); renderBuild(); return;
    }
    return openPanel({ type: "block", id });
  }
  const d = t.dataset;
  if (d.src) return openPanel({ type: "source", id: +d.src });
  if (d.part) return openPanel({ type: "part", id: d.part });
  if (d.open) return openPanel({ type: "block", id: +d.open });
  if (d.openAny) return openPanel({ type: "block", id: +d.openAny });
  if (d.openSrc) return openPanel({ type: "source", id: +d.openSrc });
  if (d.panel) return openPanel({ type: d.panel });
  if (t.hasAttribute("data-close")) return closePanel();
  if (d.verdict) { S.verdict = d.verdict; S.how = null; await renderPanel(); $("check-note")?.focus(); return; }
  if (d.save) return saveCheck(d.save);
  if (d.how) { S.how = S.how === d.how ? null : d.how; document.querySelectorAll("[data-how]").forEach(b => b.setAttribute("aria-pressed", b.dataset.how === S.how)); return; }
  if (t.hasAttribute("data-skip")) {
    const i = S.queue.findIndex(x => x.id === S.panel.id);
    const next = S.queue[(i + 1) % S.queue.length];
    S.queueMode = true; return openPanel({ type: "block", id: next.id });
  }
  if (d.pkg) { await setPackage([...S.ws.package, +d.pkg]); return S.panel && renderPanel(); }
  if (d.unpkg) { await setPackage(S.ws.package.filter(x => x !== +d.unpkg)); return S.panel && renderPanel(); }
  if (d.filter) { S.filter = d.filter; return renderReview(); }
  if (t.hasAttribute("data-mine")) { S.mine = !S.mine; return renderReview(); }
  switch (t.id) {
    case "queue-btn": if (S.queue.length) { S.queueMode = true; await openPanel({ type: "block", id: S.queue[0].id }); } return;
    case "v-build": return setView("build");
    case "v-review": return setView("review");
    case "breakdown-btn": return openPanel({ type: "breakdown" });
    case "connect-btn": S.connecting = !S.connecting; S.selected.clear(); if (S.connecting && S.panel) closePanel(true); renderConnect(); renderBuild(); return;
    case "connect-cancel": S.selected.clear(); S.connecting = false; renderConnect(); renderBuild(); return;
    case "connect-add": return connect();
    case "connect-prompt": return copy(connectPrompt([...S.selected], $("connect-add").dataset.target), "Prompt copied. Paste it into your AI tool.");
    case "bd-run": return breakDown();
    case "bd-sample": $("bd-text").value = SAMPLE_AI_TEXT; $("bd-title").value = "AI summary of checkout research"; return;
    case "bd-prompt": return copy(breakdownPrompt($("bd-text").value.trim()), "Prompt copied. Paste it into your AI tool.");
    case "copy-obs-prompt": return copy(obsPrompt(), "Prompt copied. Paste it into your AI tool.");
    case "save-part": {
      const k = d.key, body = { study_id: S.ws.id, by: S.me };
      if (k === "question") { body.question = $("f-question").value.trim(); body.decision = $("f-decision").value.trim(); }
      else body[k] = $("f-" + k).value.trim();
      if (await run(() => api("update_study", body))) { toast("Base updated."); await reload(); }
      return;
    }
    case "add-src": {
      const title = $("n-title").value.trim(), body = $("n-body").value.trim();
      if (!title || !body) return toast("Add a title and some text.", true);
      if (await run(() => api("add_source", { study_id: S.ws.id, by: S.me, title, body, kind: $("n-kind").value }))) { toast("Source added to the base."); await reload(); }
      return;
    }
  }
});
document.addEventListener("mouseover", e => {
  if (S.view !== "build" || S.connecting || !S.ws) return;
  const b = e.target.closest?.(".brick");
  if (b) trace(+b.dataset.id);
});
document.addEventListener("mouseout", e => {
  if (S.view !== "build" || !S.ws) return;
  const b = e.target.closest?.(".brick");
  if (b && !b.contains(e.relatedTarget)) highlight();
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { if (S.panel) closePanel(); else if (S.connecting) { S.connecting = false; S.selected.clear(); renderConnect(); renderBuild(); } }
  if ((e.key === "Enter" || e.key === " ") && e.target.classList?.contains("brick")) { e.preventDefault(); e.target.click(); }
  if (e.key === "Enter" && e.target.id === "connect-text") connect();
});
$("me").addEventListener("change", async e => {
  S.me = e.target.value;
  try { localStorage.setItem("anchor-me", S.me); } catch (err) {}
  if (S.ws) { const p = S.panel; await openWorkspace(S.ws.id); if (p) await openPanel(p); } else renderHome();
});
let rz; window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => S.ws && S.view === "build" && renderBuild(), 120); });

// ---------- Start ----------
(async () => {
  try {
    [S.people, S.config] = await Promise.all([api("people"), api("config")]);
    let saved = null;
    try { saved = localStorage.getItem("anchor-me"); } catch (e) {}
    S.me = S.people.find(p => p.name === saved)?.name || S.people.find(p => p.sme)?.name || S.people[0]?.name || "You";
    $("me").innerHTML = (S.people.length ? S.people : [{ name: S.me }]).map(p => `<option value="${esc(p.name)}"${p.name === S.me ? " selected" : ""}>${esc(p.name)}${p.sme ? " (SME)" : ""}</option>`).join("");
    await route();
  } catch (e) {
    $("main").innerHTML = `<div class="loading">Could not load: ${esc(e.message)}</div>`;
  }
})();
</script>
</body>
</html>
