<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ANCHOR Workbench</title>
<link rel="icon" href="data:,">
<style>
  /* The workbench. One workspace, two views you pick between: Map shows the
     whole shape, from the plan down to single blocks; Flow shows the data
     moving left to right, from sources to the decision. Both share the
     details panel, Focus sessions, conflicts, and clean up. How full a block
     is says how checked it is. Only trouble gets words and color.
     System fonts only: the app makes no outside calls. */
  :root {
    --bg: #ECEFF3; --surface: #FFFFFF; --ink: #15202C; --muted: #5A6776; --line: #C4CDD8; --line-soft: #DCE2E9;
    --accent: #2D5BD7; --accent-soft: #E3EAFB; --on-accent: #FFFFFF;
    --fill-owner: #DDE6F7; --fill-peers: #A9C1F2; --fill-sme: #2D5BD7; --on-sme: #FFFFFF;
    --amber: #A8660C; --amber-bg: #FFF1D9; --red: #C23B32; --red-bg: #FDE5E2; --green: #1F7A4D; --green-bg: #DDF3E6;
    --glow: #F2B33D; --stone: #DFE4EA; --grid: rgba(21,32,44,.06);
    --shadow: 0 1px 0 rgba(21,32,44,.08), 0 2px 6px rgba(21,32,44,.06);
    --lift: 0 10px 30px rgba(21,32,44,.18);
    --f-body: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --f-mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    --panel: 420px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0E141B; --surface: #17202A; --ink: #E4EAF1; --muted: #93A1B1; --line: #2D3947; --line-soft: #222C38;
      --accent: #6F97FF; --accent-soft: #1C2A44; --on-accent: #0E141B;
      --fill-owner: #1F2E45; --fill-peers: #2B4A82; --fill-sme: #4C7DF0; --on-sme: #FFFFFF;
      --amber: #E6A646; --amber-bg: #3A2A12; --red: #F0766C; --red-bg: #3D1C1A; --green: #5CC98E; --green-bg: #12301F;
      --glow: #F2B33D; --stone: #2B3643; --grid: rgba(255,255,255,.04);
      --shadow: 0 1px 0 rgba(0,0,0,.4), 0 2px 8px rgba(0,0,0,.3); --lift: 0 12px 34px rgba(0,0,0,.55);
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 14px/1.45 var(--f-body); -webkit-tap-highlight-color: transparent; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  h1, h2, h3 { margin: 0; text-wrap: balance; }
  a { color: var(--accent); }
  .muted, .note { color: var(--muted); }
  .note { font-size: 12.5px; }
  .amber, .warn { color: var(--amber); }
  .row { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; }
  .grow { flex: 1; }
  .stack { display: flex; flex-direction: column; gap: 8px; }
  .loading { padding: 40px 20px; color: var(--muted); }

  /* Frame */
  .app { height: 100%; display: grid; grid-template-rows: auto auto minmax(0, 1fr); grid-template-columns: minmax(0, 1fr); }
  .app.in-ws { grid-template-columns: minmax(0, 1fr) var(--panel); }
  .app.in-ws.wide { --panel: 560px; }
  .bar { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; padding: calc(8px + env(safe-area-inset-top, 0px)) 16px 8px; border-bottom: 1px solid var(--line); background: var(--bg); min-width: 0; }
  .brand { font-weight: 800; letter-spacing: .04em; font-size: 13px; color: var(--ink); text-decoration: none; }
  .bar .title { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1; }
  .who { display: inline-flex; gap: 6px; align-items: center; font-size: 12.5px; color: var(--muted); flex: none; }
  .who select { padding: 3px 6px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); }
  .viewsw { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; background: var(--surface); flex: none; }
  .viewsw button { border: 0; background: none; padding: 5px 14px; font-size: 13px; font-weight: 600; color: var(--muted); }
  .viewsw button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
  .viewsw.mini button { padding: 3px 9px; font-size: 12px; }
  .tools { grid-column: 1; display: flex; align-items: center; gap: 8px; padding: 8px 16px; border-bottom: 1px solid var(--line-soft); min-width: 0; flex-wrap: wrap; }
  .tools .chips { flex: 1 1 260px; min-width: 0; }
  .tools .acts { display: flex; gap: 8px; flex: none; }
  .main { grid-column: 1; grid-row: 3; min-height: 0; min-width: 0; position: relative; display: flex; flex-direction: column; }
  .app:not(.in-ws) .main { grid-row: 2 / 4; overflow: auto; }
  @media (max-width: 899px) {
    .app.in-ws, .app.in-ws.wide { grid-template-columns: minmax(0, 1fr); }
    .bar .title, .who .lbl { display: none; }
    .tools { padding: 8px 12px; gap: 6px; }
    .tools .find, .tools .chips, .tools .acts { flex: 1 1 100%; }
    .tools .chips, .tools .acts { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
    .tools .chips > *, .tools .acts > * { flex: none; }
  }

  .btn { border: 1px solid var(--line); background: var(--surface); padding: 6px 12px; border-radius: 8px; box-shadow: var(--shadow); white-space: nowrap; color: var(--ink); text-decoration: none; display: inline-block; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
  .btn.danger { border-color: var(--red); color: var(--red); }
  .btn.ghost { background: none; box-shadow: none; border-color: transparent; }
  .btn:disabled { opacity: .45; cursor: default; }
  .linkbtn { border: 0; background: none; color: var(--accent); padding: 0; font-weight: 500; text-align: left; }
  .iconbtn { border: 1px solid transparent; background: none; color: var(--muted); border-radius: 6px; padding: 2px 8px; font-size: 15px; line-height: 1.3; }
  .iconbtn:hover { border-color: var(--line); color: var(--ink); }
  .chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chips button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 11px; font-size: 12.5px; white-space: nowrap; flex: none; }
  .chips button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .chips .n { font-variant-numeric: tabular-nums; opacity: .7; margin-left: 3px; }
  input[type="text"], input[type="url"], input[type="search"], textarea, select.fld { width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); resize: vertical; }
  .find { width: 180px; padding: 5px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 12.5px; }

  /* Marks */
  .shape { width: 11px; height: 11px; display: inline-block; border: 1.5px solid currentColor; flex: none; }
  .shape.observation { border-radius: 1px; }
  .shape.finding { border-radius: 50%; border-style: dashed; }
  .shape.insight { transform: rotate(45deg) scale(.85); }
  .shape.source { border-radius: 2px; background: var(--stone); border-color: var(--line); height: 8px; width: 13px; }
  .shape.decision { border-radius: 2px; background: var(--ink); border-color: var(--ink); width: 13px; }
  .tag { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; padding: 1px 8px; border-radius: 999px; white-space: nowrap; border: 1px solid var(--line); background: var(--surface); }
  .tag.t-needs_check { border-style: dashed; border-color: var(--muted); }
  .tag.t-needs_changes { color: var(--amber); border-color: var(--amber); background: var(--amber-bg); }
  .tag.t-disagreement { color: var(--red); border-color: var(--red); background: var(--red-bg); }
  .tag.t-retired { color: var(--muted); border-style: dashed; }
  .tag.t-nothing { color: var(--amber); border-color: var(--amber); background: transparent; }
  .ai { font-family: var(--f-mono); font-size: 9.5px; border: 1px solid currentColor; border-radius: 3px; padding: 0 3px; opacity: .75; line-height: 1.5; }
  .sq { width: 12px; height: 8px; border-radius: 2px; border: 1px solid var(--line); display: inline-block; flex: none; }
  .s-needs_check { background: transparent; border: 1.5px dashed var(--muted); }
  .s-checked_by_owner { background: var(--fill-owner); }
  .s-checked_by_peers { background: var(--fill-peers); }
  .s-checked_by_sme { background: var(--fill-sme); border-color: var(--fill-sme); }
  .s-needs_changes { background: var(--amber-bg); border-color: var(--amber); }
  .s-disagreement { background: var(--red-bg); border-color: var(--red); }
  .s-retired { background: repeating-linear-gradient(135deg, var(--line) 0 2px, transparent 2px 5px); border-color: var(--line); }
  .cb { border-radius: 999px; padding: 0 6px; font-weight: 800; font-size: 11px; background: var(--red); color: var(--on-sme); }

  /* Home */
  .home { padding: 20px 16px 40px; max-width: 1100px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
  .home h1 { font-size: 24px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); gap: 12px; }
  .card { background: var(--surface); border-radius: 12px; box-shadow: var(--shadow); padding: 16px; display: flex; flex-direction: column; gap: 8px; text-align: left; border: 1px solid transparent; color: inherit; text-decoration: none; }
  .card:hover { border-color: var(--line); }
  .card .q { font-weight: 700; font-size: 16px; line-height: 1.25; }
  .mini { display: flex; flex-wrap: wrap; gap: 3px; }
  .mini i { width: 12px; height: 8px; border-radius: 2px; border: 1px solid var(--line); display: block; }
  .form { background: var(--surface); border-radius: 12px; box-shadow: var(--shadow); padding: 16px; display: grid; gap: 8px; max-width: 640px; }
  .form h2 { font-size: 16px; }

  /* Map view */
  .stage { flex: 1; position: relative; overflow: hidden; touch-action: none; cursor: grab; background:
      linear-gradient(var(--grid) 1px, transparent 1px) 0 0 / 40px 40px,
      linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0 / 40px 40px, var(--bg); }
  .stage.dragging { cursor: grabbing; }
  .world { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
  .world svg { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
  .district { position: absolute; border-radius: 24px; background: color-mix(in srgb, var(--surface) 55%, transparent); border: 2px solid var(--line-soft); }
  .district h3 { position: absolute; left: 24px; top: 20px; right: 24px; font-size: 22px; line-height: 1.2; font-weight: 800; }
  .district .lvl { position: absolute; left: 24px; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
  .far { position: absolute; left: 24px; right: 24px; top: 24px; z-index: 3; font-size: calc(13px * var(--iz)); line-height: 1.3; background: var(--surface); border: calc(1px * var(--iz)) solid var(--line); border-radius: calc(10px * var(--iz)); padding: calc(8px * var(--iz)) calc(9px * var(--iz)); box-shadow: var(--shadow); display: none; flex-direction: column; max-height: calc(100% - 48px); overflow: hidden; gap: calc(5px * var(--iz)); text-align: left; color: var(--ink); }
  .world.is-far .far { display: flex; }
  .world.is-far .district h3, .world.is-far .lvl { visibility: hidden; }
  .world.tracing .far, .world.zone .far { display: none; }
  .far b { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  @media (max-width: 899px) { .far b { -webkit-line-clamp: 2; } }
  .far .meta { display: flex; flex-wrap: wrap; gap: .2em .8em; font-size: .88em; color: var(--muted); }
  .far .meta .w { color: var(--accent); font-weight: 600; }
  .far .meta .t { color: var(--red); font-weight: 600; }
  .bars { display: flex; height: 6px; border-radius: 3px; overflow: hidden; background: var(--line-soft); }
  .far .bars { height: calc(6px * var(--iz)); }
  .bars i { display: block; height: 100%; }
  .brick { position: absolute; border-radius: 10px; padding: 9px 10px; border: 1.5px solid color-mix(in srgb, var(--accent) 30%, var(--line)); background: var(--surface); color: var(--ink); text-align: left; font-size: 13px; line-height: 1.3; display: flex; flex-direction: column; gap: 6px; overflow: hidden; transition: opacity .2s; }
  .brick .t { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .brick:has(.m .tag) .t { -webkit-line-clamp: 2; }
  .brick .m .tag { white-space: nowrap; }
  .brick .m { display: flex; gap: 5px; align-items: center; margin-top: auto; font-size: 11px; color: var(--muted); flex-wrap: wrap; }
  .brick.insight { font-weight: 650; font-size: 14px; border-radius: 12px; }
  .brick.source { background: var(--stone); border: 1px solid var(--line); font-size: 12px; font-weight: 600; border-radius: 6px; gap: 2px; }
  .brick.decision { background: var(--ink); color: var(--bg); border: 0; font-size: 19px; font-weight: 800; padding: 14px 18px; border-radius: 16px; justify-content: center; }
  .brick.decision .m { color: var(--bg); opacity: .8; font-size: 12px; }
  .brick.s-needs_check { border: 2px dashed var(--muted); }
  .brick.s-checked_by_owner { background: var(--fill-owner); }
  .brick.s-checked_by_peers { background: var(--fill-peers); }
  .brick.s-checked_by_sme { background: var(--fill-sme); color: var(--on-sme); border-color: var(--fill-sme); }
  .brick.s-checked_by_sme .m { color: var(--on-sme); opacity: .85; }
  .brick.s-needs_changes { border: 3px solid var(--amber); background: var(--amber-bg); }
  .brick.s-disagreement { border: 3px solid var(--red); background: var(--red-bg); }
  .brick.s-retired { background: repeating-linear-gradient(135deg, var(--line-soft) 0 6px, var(--surface) 6px 12px); border: 1.5px dashed var(--line); color: var(--muted); }
  .brick.s-retired .t { text-decoration: line-through; }
  .brick.glow { box-shadow: 0 0 0 3px var(--glow), 0 0 22px color-mix(in srgb, var(--glow) 50%, transparent); }
  .brick.sel { outline: 4px solid var(--accent); outline-offset: 3px; }
  .brick.picked { outline: 3px dashed var(--accent); outline-offset: 3px; }
  .brick.fresh::after, .it.fresh::after { content: ""; position: absolute; top: 6px; right: 6px; width: 9px; height: 9px; border-radius: 50%; background: var(--accent); }
  .world.is-mid .brick:not(.decision) .t, .world.is-mid .brick:not(.decision) .m, .world.is-far .brick:not(.decision) .t, .world.is-far .brick:not(.decision) .m { visibility: hidden; }
  .world.is-far .brick:not(.decision) { opacity: .5; }
  .world.is-far .brick.decision { transform: scale(calc(var(--iz) * .3)); transform-origin: 50% 100%; }
  .world.filtering .brick:not(.match):not(.decision) { opacity: .13; }
  .world.tracing .brick:not(.near) { opacity: .12; }
  .world.is-far.tracing .brick.near, .world.is-far.zone .brick.todo { opacity: 1; }
  .world.zone .brick:not(.near):not(.todo) { opacity: .07; }
  .world.zone .brick.todo:not(.near) { opacity: .45; outline: 2px dotted var(--accent); outline-offset: 2px; }
  .world.connecting .brick.insight { opacity: .35; }
  .wire { fill: none; stroke: var(--muted); stroke-width: 1.6; opacity: .25; }
  .wire.src { stroke-dasharray: 3 4; opacity: .18; }
  .wire.weak { stroke: var(--amber); stroke-dasharray: 6 5; opacity: .5; }
  .world.is-far .wire { opacity: .08; }
  .world.tracing .wire, .world.zone .wire { opacity: .03; }
  .world.tracing .wire.hot { opacity: 1; stroke: var(--accent); stroke-width: calc(2.6px * var(--iz-wire)); stroke-dasharray: none; }
  .world.tracing .wire.hot.weak { stroke: var(--amber); stroke-dasharray: 8 6; }
  .pathline { fill: none; stroke: var(--glow); stroke-width: calc(5px * var(--iz-wire)); stroke-linecap: round; stroke-linejoin: round; opacity: .85; }
  .pathdot { fill: var(--glow); }
  .clash { fill: none; stroke: var(--red); stroke-width: calc(3px * var(--iz-wire)); opacity: .85; }
  .world.tracing .clash:not(.hot), .world.zone .clash:not(.hot) { opacity: .1; }
  .clashbadge { position: absolute; z-index: 4; transform: translate(-50%, -50%) scale(clamp(1, calc(var(--iz) * .5), 9)); border: 2px solid var(--surface); background: var(--red); color: var(--on-sme); border-radius: 999px; width: 28px; height: 28px; padding: 0; font-weight: 800; font-size: 14px; box-shadow: var(--lift); }
  .world.is-far .clashbadge { display: none; }
  .zoomctl { position: absolute; right: 12px; bottom: 12px; display: flex; flex-direction: column; gap: 6px; z-index: 5; }
  .zoomctl button { width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); box-shadow: var(--shadow); font-size: 18px; font-weight: 600; }
  .maphint { position: absolute; left: 12px; top: 10px; z-index: 5; font-size: 11.5px; color: var(--muted); background: color-mix(in srgb, var(--surface) 85%, transparent); border: 1px solid var(--line-soft); border-radius: 999px; padding: 3px 10px; }
  @media (max-width: 899px) { .maphint { display: none; } }

  /* Flow view */
  .flowview { flex: 1; display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  .path { display: flex; padding: 8px 16px; overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid var(--line-soft); background: var(--surface); flex: none; }
  .path::-webkit-scrollbar { display: none; }
  .pstep { display: flex; flex-direction: column; gap: 1px; min-width: 0; flex: 1 1 0; border: 0; background: none; text-align: left; padding: 2px 10px 2px 0; color: var(--ink); position: relative; }
  .pstep + .pstep { padding-left: 14px; }
  .pstep + .pstep::before { content: "›"; position: absolute; left: 0; top: 50%; transform: translateY(-50%); color: var(--muted); }
  .pstep .l { font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
  .pstep .v { font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 24ch; }
  .pstep .v.none { color: var(--muted); }
  .pstep .v.many { color: var(--accent); font-weight: 600; }
  .pstep.here .l { color: var(--accent); }
  .cols { flex: 1; display: grid; grid-template-columns: minmax(0, .9fr) repeat(3, minmax(0, 1fr)) minmax(120px, .6fr); min-height: 0; position: relative; overflow: hidden; }
  .col { display: flex; flex-direction: column; min-height: 0; min-width: 0; border-right: 1px solid var(--line-soft); }
  .col:last-of-type { border-right: 0; }
  .col-h { padding: 9px 12px 7px; display: flex; flex-direction: column; gap: 4px; border-bottom: 1px solid var(--line-soft); background: var(--bg); }
  .col-h .t { display: flex; align-items: center; gap: 7px; font-weight: 700; font-size: 13px; }
  .col-h .t .n { font-weight: 500; color: var(--muted); }
  .col-h .fl { font-size: 11px; color: var(--muted); }
  .col-b { overflow-y: auto; padding: 8px 8px 60px; display: flex; flex-direction: column; gap: 5px; min-height: 0; overscroll-behavior: contain; }
  .grp { display: flex; justify-content: space-between; align-items: center; gap: 6px; font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 700; padding: 8px 4px 2px; border: 0; background: none; width: 100%; text-align: left; }
  .grp .q { text-transform: none; letter-spacing: 0; font-weight: 600; font-size: 11.5px; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .grp.linked { color: var(--accent); }
  .it { display: grid; grid-template-columns: 12px minmax(0, 1fr); gap: 3px 8px; text-align: left; width: 100%; border: 1.5px solid transparent; background: var(--surface); border-radius: 8px; padding: 7px 9px 7px 11px; color: var(--ink); box-shadow: var(--shadow); position: relative; }
  .it .shape { margin-top: 3px; }
  .it .s { font-size: 12.5px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .it .m { grid-column: 2; display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; font-size: 11px; color: var(--muted); }
  .it .links { margin-left: auto; display: inline-flex; gap: 2px; }
  .it .links span { border: 1px solid var(--line-soft); border-radius: 4px; padding: 0 4px; font-variant-numeric: tabular-nums; }
  .it .fill { width: 4px; position: absolute; left: 0; top: 6px; bottom: 6px; border-radius: 0 3px 3px 0; }
  .it.s-needs_check { border: 1.5px dashed var(--muted); box-shadow: none; }
  .it.s-needs_changes { border-color: var(--amber); }
  .it.s-disagreement { border-color: var(--red); }
  .it.s-retired { opacity: .55; box-shadow: none; border: 1.5px dashed var(--line); }
  .it.s-retired .s { text-decoration: line-through; }
  .it.glow { box-shadow: 0 0 0 2px var(--glow); }
  .it.lin { background: color-mix(in srgb, var(--accent-soft) 55%, var(--surface)); }
  .it.sel { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); background: var(--accent-soft); }
  .it.picked { outline: 2px dashed var(--accent); outline-offset: 1px; }
  .it.todo:not(.sel) { outline: 2px dotted var(--accent); outline-offset: 1px; }
  .it.src { background: var(--stone); box-shadow: none; }

<script>
"use strict";
// ---------- Words (docs/GLOSSARY.md) ----------
const LEVEL = { observation: "Observation", finding: "Finding", insight: "Insight" };
const NEXT = { observation: "finding", finding: "insight" };
const UNCHECKED = new Set(["needs_check", "needs_changes", "disagreement"]);
const VERDICT = { looks_right: "Looks right", needs_changes: "Needs changes", disagree: "Disagree" };
const REVIEW_SAID = { approve: "Looks right", changes: "Needs changes", disagree: "Disagree" };
const TAG = { needs_check: "Needs a check", needs_changes: "Needs changes", disagreement: "Disagreement", retired: "Retired" };
const PLAN_TAG = { open: "Open", in_progress: "In progress", answered: "Answered" };
const RETIRE_REASONS = ["Out of date", "Out of scope", "Wrong", "Replaced by another block", "Duplicate of another block"];
const OUTCOMES = {
  pick_one: ["Pick one", "Keep one. The other is retired."],
  keep_both: ["Keep both, narrow each", "Both are true in different cases."],
  not_a_conflict: ["Not a conflict", "They fit together."],
  not_sure_yet: ["Not sure yet", "Add an open question to the plan."],
};
// Things to consider before checking, by level.
const ASKS = {
  observation: ["Does the source say exactly this, no more and no less?", "If there is a number, does it match the source?"],
  finding: ["Do the blocks under it really add up to this?", "Would a skeptic read them the same way?"],
  insight: ["Does it follow from the findings under it?", "Does it say why this matters to our goal?", "What would make it wrong?"],
};
const SAMPLE_AI_TEXT = `Checkout summary (drafted by an AI assistant)

Mobile checkout conversion is 42 percent, well below desktop.
Most shoppers leave because the address form is too long.
Returning shoppers clearly convert better because they trust the brand.
Adding Apple Pay would likely fix the rest of the drop-off.
Fixing the address step is our biggest checkout opportunity.
We should prioritize autofill and Apple Pay in Q3.`;

// ---------- State ----------
const S = {
  me: null, people: [], config: null, ws: null, queue: [], wait: new Map(),
  view: "map", mode: "work",              // mode: work or breakdown
  panel: null, trail: [], detail: null, maybe: [], verdict: null, how: null, act: null, cf: {},
  lens: "all", showRetired: false, find: "", fold: new Set(), unfold: new Set(),
  connecting: false, picked: new Set(), answering: null,
  session: null, path: [], fresh: new Set(), wide: false, sheet: "peek",
  bd: null, bdOn: 0, bdFilter: "all", tidySel: new Set(),
  z: 1, x: 0, y: 0,
};

// ---------- Helpers ----------
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const plural = (n, w) => n + " " + w + (n === 1 ? "" : "s");
const isPhone = () => matchMedia("(max-width: 899px)").matches;
const byId = id => S.ws?.blocks.find(b => b.id === +id);
const srcById = id => S.ws?.sources.find(s => s.id === +id);
const qById = id => S.ws?.plan.find(q => q.id === id);
const live = () => S.ws.blocks.filter(b => b.stage !== "retired");
const shown = () => S.ws.blocks.filter(b => b.stage !== "retired" || S.showRetired || (S.panel?.type === "block" && S.panel.id === b.id));
const isSme = name => S.people.find(p => p.name === name)?.sme;
const madeWithAI = b => b.origin !== "person";
const originText = b => b.origin === "ai_agent" ? "AI draft for " + b.owner : b.origin === "person_with_ai" ? b.owner + " with AI" : b.owner;
const state = b => b.check.state;
const unchecked = b => UNCHECKED.has(state(b));
const glow = b => b.level === "insight" && ["checked_by_peers", "checked_by_sme"].includes(state(b));
const trouble = b => b.stage !== "retired" && (["needs_changes", "disagreement"].includes(state(b)) || b.rests_on_nothing || b.based_on_retired.length > 0 || b.no_spot.length > 0);
const above = id => S.ws.blocks.filter(b => b.built_on.includes(+id));
const citedBy = sid => S.ws.blocks.filter(b => b.source_ids.includes(+sid));
const tag = st => TAG[st] ? `<span class="tag t-${st}">${TAG[st]}</span>` : "";
const sq = b => `<span class="sq s-${state(b)}"></span>`;
const lbl = b => b ? `${LEVEL[b.level]} #${b.id}` : "";
function below(id, out = new Set()) { (byId(id)?.built_on || []).forEach(x => { if (!out.has(x)) { out.add(x); below(x, out); } }); return out; }
function upward(id, out = new Set()) { above(id).forEach(p => { if (!out.has(p.id)) { out.add(p.id); upward(p.id, out); } }); return out; }
// The whole line of a block: what it is based on, down to sources, and what it supports.
function lineage(key) {
  const set = new Set([key]);
  if (String(key).startsWith("s")) {
    citedBy(key.slice(1)).forEach(b => { set.add(b.id); upward(b.id).forEach(x => set.add(x)); });
  } else if (key === "D") {
    decisionInsights().forEach(i => { set.add(i.id); below(i.id).forEach(x => set.add(x)); });
  } else {
    below(key).forEach(x => set.add(x)); upward(key).forEach(x => set.add(x));
  }
  [...set].forEach(x => (byId(x)?.source_ids || []).forEach(s => set.add("s" + s)));
  return set;
}
const decisionInsights = () => { const pkg = S.ws.package.map(byId).filter(Boolean); return pkg.length ? pkg : live().filter(b => b.level === "insight"); };
function badges(b) {
  const out = [];
  if (b.stage === "retired") return tag("retired");
  if (["needs_changes", "disagreement"].includes(state(b))) out.push(tag(state(b)));

  const waiting = S.queue.map(i => byId(i.id)).filter(Boolean).sort(bottomUp);
  if (waiting.length) out.push({ kind: "waits", k: "Waiting on you", title: "Check " + plural(waiting.length, "block"), sub: "From the bottom up, so what you check first supports what comes next", items: waiting.map(b => b.id) });

    const items = under.filter(b => S.wait.has(b.id)).sort(bottomUp);

    out.push({ kind: "evidence", k: "Check the evidence for", title: x.ins.statement, sub: `${x.items.length} wait on you · ${Math.round(x.pct * 100)}% checked under it`, items: x.items.map(b => b.id) }));

function walk(dir) {

// ---------- Clean up ----------
function tidyFinds() {
  const blocks = live();
  const seen = new Map(), dups = [];
  blocks.forEach(b => { const k = b.level + "|" + b.statement.toLowerCase().trim(); if (seen.has(k)) dups.push([seen.get(k), b]); else seen.set(k, b); });

  const onRetired = blocks.filter(b => b.based_on_retired.length);

function quoteFor(body, text) {

    const hit = nums.some(n => line.includes(n)) || (line.toLowerCase().match(/[a-z]{5,}/g) || []).some(w => [...words].some(x => x.slice(0, 5) === w.slice(0, 5)));
    return hit ? `<mark>${esc(line)}</mark>` : esc(line);

}
// What you can do depends on who you are and the block's state.
function checkHtml(d, here) {

  if (mine && S.act === "keep") return `<div class="stack"><textarea id="keep-note" rows="2" placeholder="Why it is right as written"></textarea><label class="check-line"><input type="checkbox" id="ask-sme" checked> Ask an SME to look at it</label><div class="row"><button class="btn primary" data-save-keep>Reply</button><button class="btn ghost" data-act="">Cancel</button></div></div>`;
  if (mine) {

  let h = `${dis.length ? `<div class="note">${esc(dis.join(" and "))} ${dis.length > 1 ? "disagree" : "disagrees"}. Where do you land?</div>` : ""}
    <div class="verdicts">${Object.entries(VERDICT).map(([k, v]) => `<button data-verdict="${k}" aria-pressed="${S.verdict === k}">${v}</button>`).join("")}</div>`;
  if (S.verdict) {
    const checks = S.config?.checks || {};
    h += `${S.verdict === "looks_right" ? `<div class="note">How did you check? (optional)</div><div class="hows">${Object.entries(checks).map(([k, v]) => `<button data-how="${k}" aria-pressed="${S.how === k}">${esc(v)}</button>`).join("")}</div>` : ""}

      <div class="row"><button class="btn primary" data-save="${S.verdict}">Save check</button>${S.session ? `<span class="note">Then the next one opens.</span>` : ""}</div>`;
  }
  return h;
}

// ---------- Sheets for retire, delete, and picking blocks ----------
function sheet(html, onClick) {
  const m = $("modal");
  m.hidden = false; m.innerHTML = `<div class="sheet" role="dialog">${html}</div>`;
  m.onclick = e => { if (e.target === m || e.target.closest("[data-cancel]")) { m.hidden = true; return; } onClick(e.target); };
}
const closeSheet = () => { $("modal").hidden = true; };
const pickRow = (b, attr, on) => `<button class="under-item" ${attr}="${b.id}" aria-pressed="${on}"><span class="q">${esc(b.statement)}</span><span class="r"><span class="shape ${b.level}"></span>${LEVEL[b.level]} #${b.id} · ${esc(b.check.label)}</span></button>`;
function retireSheet(ids) {
  const list = ids.map(byId), st = { reason: null, other: null, move: true, q: "" };
  const draw = () => {
    const needOther = st.reason === "Replaced by another block" || st.reason === "Duplicate of another block";
    const ups = new Set(list.flatMap(b => above(b.id).map(x => x.id)));
    const cands = needOther ? live().filter(x => x.level === list[0].level && !ids.includes(x.id) && x.statement.toLowerCase().includes(st.q.toLowerCase())).slice(0, 30) : [];
    sheet(`<h2>Retire ${list.length === 1 ? "#" + list[0].id : plural(list.length, "block")}</h2>${list.length === 1 ? `<div class="note">${esc(list[0].statement)}</div>` : ""}
      <div class="sect"><h3>Why</h3><div class="chips" style="flex-wrap:wrap">${RETIRE_REASONS.map(r => `<button data-reason="${r}" aria-pressed="${st.reason === r}">${r}</button>`).join("")}</div></div>
      ${needOther ? `<div class="sect"><h3>Which block</h3><input type="search" id="pickq" placeholder="Find a block" value="${esc(st.q)}"><div class="picklist">${cands.map(x => pickRow(x, "data-pick-other", st.other === x.id)).join("") || `<div class="note">No match.</div>`}</div></div>` : ""}
      <div class="impact">${ups.size ? `${plural(ups.size, "block")} ${ups.size === 1 ? "is" : "are"} based on ${list.length === 1 ? "it" : "them"}, and will show that.` : `Nothing is based on ${list.length === 1 ? "it" : "them"}.`}</div>
      ${ups.size && st.other ? `<label class="check-line"><input type="checkbox" id="mv" ${st.move ? "checked" : ""}> Move them onto #${st.other}</label>` : ""}
      <div class="note">Retired blocks keep their history and can be brought back.</div>
      <div class="row"><button class="btn primary" data-do-retire ${st.reason && (!needOther || st.other) ? "" : "disabled"}>Retire</button><button class="btn ghost" data-cancel>Cancel</button></div>`, async t => {
      const r = t.closest("[data-reason]"); if (r) { st.reason = r.dataset.reason; st.other = null; return draw(); }
      const o = t.closest("[data-pick-other]"); if (o) { st.other = +o.dataset.pickOther; return draw(); }
      if (t.id === "mv") { st.move = t.checked; return; }
      if (t.closest("[data-do-retire]")) {
        const reason = st.reason === "Duplicate of another block" ? `Duplicate of #${st.other}` : st.reason === "Replaced by another block" ? null : st.reason;
        for (const b of list) if (!await run(() => api("retire", { learning_id: b.id, by: S.me, reason, replaced_by: st.other, move: !!(st.other && st.move) }))) return;
        closeSheet(); S.tidySel.clear();
        toast(`Retired ${list.length === 1 ? "#" + list[0].id : plural(list.length, "block")}.`, false, async () => { for (const b of list) await run(() => api("bring_back", { learning_id: b.id, by: S.me })); await reload(); });
        if (S.session && list.some(b => b.id === S.session.items[S.session.idx])) { await fetchWorkspace(S.ws.id); S.mapBuilt = false; renderWorkspace(); return nextInSession(true); }
        await reload();
      }
    });
    const pq = $("pickq"); if (pq) pq.oninput = e => { st.q = e.target.value; draw(); const n = $("pickq"); n.focus(); n.setSelectionRange(n.value.length, n.value.length); };
  };
  draw();
}
function deleteSheet(b) {
  const ups = above(b.id).length;
  sheet(`<h2>Delete #${b.id} for good?</h2><div class="note">${esc(b.statement)}</div>
    <div class="impact">Its earlier versions and checks go too. This can't be undone.${ups ? ` ${plural(ups, "block")} based on it will lose it.` : ""}</div>
    <div class="note">To keep its history, retire it instead.</div>
    <div class="row"><button class="btn danger" data-do-delete>Delete for good</button><button class="btn ghost" data-cancel>Cancel</button></div>`, async t => {
    if (!t.closest("[data-do-delete]")) return;

    closeSheet(); toast(`Deleted #${b.id}.`);
    S.path = S.path.filter(x => x !== b.id);
    await fetchWorkspace(S.ws.id); S.mapBuilt = false; renderWorkspace();
    if (S.session && S.session.items[S.session.idx] === b.id) return nextInSession(true);
    await backToWorkspace();
  });
}
function pickSheet(title, note, cands, multi, onDone, withNote) {
  const st = { on: new Set(), q: "" };
  const draw = () => {
    const list = cands().filter(x => x.statement.toLowerCase().includes(st.q.toLowerCase())).slice(0, 40);
    sheet(`<h2>${esc(title)}</h2><div class="note">${note}</div><input type="search" id="pickq" placeholder="Find a block" value="${esc(st.q)}">
      <div class="picklist">${list.map(x => pickRow(x, "data-pick", st.on.has(x.id))).join("") || `<div class="note">No match.</div>`}</div>
      ${withNote ? `<textarea id="pick-note" rows="2" placeholder="${withNote}"></textarea>` : ""}
      <div class="row"><button class="btn primary" data-pick-done ${st.on.size ? "" : "disabled"}>${multi ? `Add ${st.on.size || ""}` : "Done"}</button><button class="btn ghost" data-cancel>Cancel</button></div>`, async t => {
      const p = t.closest("[data-pick]"); if (p) { const id = +p.dataset.pick; if (!multi) st.on.clear(); st.on.has(id) ? st.on.delete(id) : st.on.add(id); const note = $("pick-note")?.value; draw(); if (note && $("pick-note")) $("pick-note").value = note; return; }
      if (t.closest("[data-pick-done]")) { const note = ($("pick-note")?.value || "").trim(); closeSheet(); await onDone([...st.on], note); }
    });
    const pq = $("pickq"); pq.oninput = e => { st.q = e.target.value; draw(); const n = $("pickq"); n.focus(); n.setSelectionRange(n.value.length, n.value.length); };
  };
  draw();
}

// ---------- Prompts for the person's own AI tool ----------
const planPrompt = () => `Use the ANCHOR prompt "plan_analysis" with study_id=${S.ws.id}, or: call get_workspace(study_id=${S.ws.id}) and read the question, the decision, and the sources. Draft 2 to 5 sub-questions the decision turns on, each with what we expect to find. For each, query it and tell me what other workspaces already know, with each block's check state. Let me keep, change, or drop each one, then add the ones I keep with add_question.`;
const obsPrompt = () => `Call get_workspace(study_id=${S.ws.id}). Open every linked source yourself. Write observations: only what was seen or measured, one claim each, citing the source id and the exact spot in it (spots), like {"3": "S7 at 18:02"}. Then findings based on them, then insights based on findings. Give every block confidence (low, medium, high), why in one line, and what it assumes. Add them with add_blocks as drafts for me to check.`;
const breakdownPrompt = text => `Take this AI text apart into building blocks in ANCHOR workspace ${S.ws.id}. Call add_source with it (kind "ai_text"), then add_blocks: one claim per block, observations citing sources, findings and insights based on the blocks that show them. Give every block confidence (low, medium, high), why, and what it assumes. Tell me which claims are unsupported.\n\n${text || "<paste the text here>"}`;
const askPrompt = id => `In ANCHOR workspace ${S.ws.id}, read block #${id} with get, then what it is based on and its sources. Tell me if the evidence supports it as worded, what it takes as given, and what would make it wrong. Do not check it for me.`;
const connectPrompt = (ids, target) => `In ANCHOR workspace ${S.ws.id}, read blocks ${ids.map(i => "#" + i).join(", ")} with get. Write one ${target} they add up to, as one sentence. Add it with add(level="${target}", evidence=[${ids.join(", ")}], study_id=${S.ws.id}, origin="person_with_ai") and give confidence, why, and what it assumes.`;

// ---------- Actions ----------
async function saveCheck(verdict) {
  const d = S.detail, note = $("check-note")?.value.trim() || null;
  const body = { learning_id: d.id, by: S.me, note };
  if (verdict === "owner") {
    body.verdict = "looks_right"; body.statement = $("edit-text").value.trim();
    if (d.stage !== "draft" && body.statement === d.statement) return toast("Change the wording first, or leave it as it is.", true);
  } else {
    body.verdict = verdict; body.how = verdict === "looks_right" ? S.how : null;
    if (verdict !== "looks_right" && !note) { $("check-note").focus(); return toast("Add a short reason first.", true); }
  }
  const out = await run(() => api("check", body));
  if (!out) return;
  toast(out.learning.check.label + ".");
  await fetchWorkspace(S.ws.id); S.mapBuilt = false;
  if (S.session) { renderWorkspace(); return nextInSession(true); }
  const p = { type: "block", id: out.learning.id };
  S.trail[S.trail.length - 1] = p; S.panel = p; S.verdict = null; S.how = null;
  renderWorkspace(); await renderPanel();
}
async function setPackage(ids) {
  const out = await run(() => api("set_package", { study_id: S.ws.id, by: S.me, learning_ids: ids }));
  if (!out) return;
  if (out.warnings.length) toast("In the package. Note: " + out.warnings.join(", ") + ".");
  await reload();
}
async function resolveConflict() {
  const c = S.ws.conflicts.find(x => x.id === S.panel.id), cf = S.cf, why = ($("cf-why")?.value || "").trim();
  if (!why) { $("cf-why").focus(); return toast("Say a few words about why.", true); }
  const body = { conflict_id: c.id, by: S.me, outcome: cf.end, note: why };
  if (cf.end === "pick_one") { body.keep = cf.keep; body.move = !!$("cf-move")?.checked; }
  if (cf.end === "keep_both") body.statements = { a: $("cf-a").value.trim(), b: $("cf-b").value.trim() };
  if (cf.end === "not_sure_yet") body.question = $("cf-q").value.trim();
  const out = await run(() => api("resolve_conflict", body));
  if (!out) return;
  S.cf = { result: cf.end === "not_sure_yet" ? "Added an open question to the plan. Both stay marked Disagreement." : `${OUTCOMES[cf.end][0]}. ${why}` };
  if (S.session) S.session.done.add(c.id);
  await fetchWorkspace(S.ws.id); S.mapBuilt = false; renderWorkspace();
  if (cf.end === "not_sure_yet" && S.session) return nextInSession(true);
  await renderPanel();
  toast(cf.end === "not_sure_yet" ? "Added to the plan." : "Resolved. Everyone involved hears about it.");
}
function setView(v) {
  S.view = v; local.set("view", v);
  S.mapBuilt = false; $("main").innerHTML = "";
  S.flowJump = true;
  renderWorkspace();
  if (S.panel?.type === "block" && v === "flow" && byId(S.panel.id)) requestAnimationFrame(() => gotoCol(COLS.findIndex(c => c.level === byId(S.panel.id).level)));
}

  if (d.act != null) { S.act = d.act || null; return renderPanel(); }

  if (t.hasAttribute("data-retire")) return retireSheet([S.detail.id]);

  if (t.hasAttribute("data-new-conflict")) {

    return pickSheet(`#${b.id} conflicts with…`, `Pick the block that can't be true at the same time as: "${esc(b.statement)}"`, () => live().filter(x => x.id !== b.id && x.stage === "shared"), false, async ([other], note) => {
      if (await run(() => api("link", { from_id: b.id, to_id: other, type: "conflicts_with", by: S.me, note: note || null }))) { toast("Marked. Both show Disagreement until someone resolves it."); await reload(); }
    }, "Why can't they both be true?");
  }
  if (d.markConflict) { if (await run(() => api("link", { from_id: S.detail.id, to_id: +d.markConflict, type: "conflicts_with", by: S.me }))) { toast("Marked. Both show Disagreement until someone resolves it."); await reload(); } return; }
  if (t.hasAttribute("data-add-based")) {

      for (const id of ids) if (!await run(() => api("link", { from_id: id, to_id: b.id, type: "supports", by: S.me }))) return;

    });

  if (t.hasAttribute("data-save-keep")) {
    const note = $("keep-note").value.trim(); if (!note) { $("keep-note").focus(); return toast("Say why it is right as written.", true); }
    if (await run(() => api("ask_for_review", { learning_id: S.detail.id, by: S.me, roles: $("ask-sme").checked ? ["sme"] : [], note }).catch(async err => { if ($("ask-sme").checked) throw err; return {}; }))) { toast($("ask-sme")?.checked ? "Replied, and asked an SME to look." : "Replied."); S.act = null; await reload(); }

document.addEventListener("keydown", e => {
  const typing = e.target.closest?.("input, textarea, select");
  if (!$("modal").hidden) { if (e.key === "Escape") closeSheet(); return; }
  if (typing) { if (e.key === "Enter" && e.target.id === "connect-text") connect(); return; }
  if (e.key === "Escape") {
    if (S.connecting) { S.connecting = false; S.picked.clear(); return renderWorkspace(); }
    if (S.session) return endSession();
    if (S.panel && S.panel.type !== "workspace" && S.panel.type !== "breakdown") return backToWorkspace();
  }
  if (!S.ws || S.mode !== "work") return;
  if (e.key === "ArrowLeft") walk(-1);
  if (e.key === "ArrowRight") walk(1);
  if (S.session && e.key === "j") nextInSession(false);
  if (S.panel?.type === "block") { const k = { "1": "looks_right", "2": "needs_changes", "3": "disagree" }[e.key]; if (k && S.detail?.owner !== S.me && S.detail?.stage === "shared") { S.verdict = k; renderPanel(); } }
});
$("viewsw").addEventListener("click", e => { const b = e.target.closest("[data-view]"); if (b) setView(b.dataset.view); });
$("zonebar").addEventListener("click", e => { if (e.target.closest("[data-leave]")) return endSession(); const b = e.target.closest("[data-view]"); if (b) setView(b.dataset.view); });
$("connect").addEventListener("click", e => {
  const t = e.target.closest("button"); if (!t) return;
  if (t.id === "connect-cancel") { S.picked.clear(); S.connecting = false; S.answering = null; return renderWorkspace(); }
  if (t.id === "connect-add") return connect();
  if (t.id === "connect-prompt") return copy(connectPrompt([...S.picked], t.closest(".connect").querySelector("#connect-add").dataset.target), "Prompt copied. Paste it into your AI tool.");
});
$("me").addEventListener("change", async e => {
  S.me = e.target.value;
  try { localStorage.setItem("anchor-me", S.me); } catch (err) {}
  if (S.ws) { const p = S.panel; endSession(true); await fetchWorkspace(S.ws.id); S.mapBuilt = false; renderWorkspace(); await openPanel(p && byId(p.id) ? p : WS_PANEL); } else renderHome();
});
let rz; addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { if (S.ws && S.mode === "work") { S.mapBuilt = false; renderWorkspace(); } }, 150); });

// ---------- Start ----------
(async () => {
  try {
    [S.people, S.config] = await Promise.all([api("people"), api("config")]);
    S.wide = local.get("wide", false); S.view = local.get("view", "map") === "flow" ? "flow" : "map";
    $("app").classList.toggle("wide", S.wide);
    let saved = null;
    try { saved = localStorage.getItem("anchor-me"); } catch (e) {}
    S.me = S.people.find(p => p.name === saved)?.name || S.people.find(p => p.sme)?.name || S.people[0]?.name || "You";
    $("me").innerHTML = (S.people.length ? S.people : [{ name: S.me }]).map(p => `<option value="${esc(p.name)}"${p.name === S.me ? " selected" : ""}>${esc(p.name)}${p.sme ? " (SME)" : ""}</option>`).join("");
    await route();
  } catch (e) {
    $("main").innerHTML = `<div class="loading">Could not load: ${esc(e.message)}</div>`;
  }
})();
</script>
</body>
</html>
