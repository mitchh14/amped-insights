<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ANCHOR</title>
<link rel="icon" href="data:,">
<style>
  /* Presentation system. Every piece of information has one importance:
     L1 do now (one per screen), L2 glance, L3 on request (folded), L4 record.
     Normal states are quiet. Only contested, at risk, and needs changes use color. */
  :root {
    --bg: #f7f7f5; --surface: #ffffff; --surface-2: #f1f1ee; --line: #e3e3de; --line-strong: #cfcfc8;
    --text: #1d1d1b; --muted: #6b6b66; --accent: #2458c6; --accent-soft: #e8eefb;
    --ok: #1f7a4d; --ok-soft: #e3f3ea; --bad: #b42318; --bad-soft: #fdeceb; --warn: #9a5b00; --warn-soft: #fdf3e1;
    --obs: #6b6b66; --fnd: #c27a00; --ins: #2458c6;
    --radius: 10px; --shadow: 0 1px 2px rgba(0,0,0,.05), 0 2px 8px rgba(0,0,0,.04);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151514; --surface: #1d1d1b; --surface-2: #252523; --line: #2f2f2c; --line-strong: #41413d;
      --text: #ecece8; --muted: #a0a09a; --accent: #8fb0f5; --accent-soft: #1f2a44;
      --ok: #6fcf9d; --ok-soft: #173326; --bad: #f28b82; --bad-soft: #3a1c1a; --warn: #f0b95a; --warn-soft: #3a2c12;
      --obs: #a0a09a; --fnd: #f0b95a; --ins: #8fb0f5; --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--text); background: var(--bg); }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  h1, h2, h3 { line-height: 1.25; margin: 0; }
  h1 { font-size: 22px; font-weight: 650; }
  h2 { font-size: 16px; font-weight: 650; margin: 0 0 10px; }
  h3 { font-size: 14px; font-weight: 600; color: var(--muted); margin: 14px 0 6px; }
  p { margin: 0 0 8px; }
  input, select, textarea, button { font: inherit; color: inherit; }
  input, select, textarea { background: var(--surface); border: 1px solid var(--line-strong); border-radius: 8px; padding: 7px 10px; width: 100%; }
  textarea { resize: vertical; min-height: 64px; }
  input:focus, select:focus, textarea:focus, button:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  button { cursor: pointer; border: 1px solid var(--line-strong); background: var(--surface); border-radius: 8px; padding: 6px 12px; white-space: nowrap; }
  button:hover { background: var(--surface-2); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  @media (prefers-color-scheme: dark) { button.primary { color: #10131a; } }
  button.link { border: 0; background: none; color: var(--accent); padding: 0; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
  label.inline { display: inline-flex; gap: 6px; align-items: center; color: var(--text); font-size: 14px; margin: 4px 12px 4px 0; }
  label.inline input { width: auto; }

  /* Shell */
  .top { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 12px; padding: 10px 20px;
    background: var(--surface); border-bottom: 1px solid var(--line); }
  .brand { font-weight: 750; letter-spacing: .08em; font-size: 15px; color: var(--text); }
  .brand small { font-weight: 400; letter-spacing: 0; color: var(--muted); margin-left: 8px; }
  .me { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .shell { display: grid; grid-template-columns: 180px minmax(0, 1fr); max-width: 1120px; margin: 0 auto; }
  nav.side { position: sticky; top: 53px; align-self: start; padding: 20px 12px; display: flex; flex-direction: column; gap: 2px; }
  nav.side a { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; border-radius: 8px; color: var(--text); }
  nav.side a:hover { background: var(--surface-2); text-decoration: none; }
  nav.side a.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .count { font-size: 12px; background: var(--accent); color: #fff; border-radius: 99px; padding: 0 7px; font-weight: 600; }
  main { padding: 20px 24px 80px; min-width: 0; }
  .page-head { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
  .page-head .sub { color: var(--muted); margin-top: 2px; }
  .page-head .actions { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
  .crumb { color: var(--muted); font-size: 14px; }
  .grid { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 20px; align-items: start; }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin-bottom: 16px; box-shadow: var(--shadow); }
  .panel > h2:first-child { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .panel > h2 a, .panel > h2 button { font-size: 14px; font-weight: 400; }
  .empty { color: var(--muted); font-size: 14px; padding: 6px 0; }
  .muted { color: var(--muted); font-size: 13px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; margin: 8px 0; }
  .kv dt { color: var(--muted); font-size: 13px; }
  .kv dd { margin: 0; overflow-wrap: anywhere; }

  /* L1: the one thing to do now */
  .step { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: var(--radius);
    padding: 16px 18px; margin-bottom: 20px; box-shadow: var(--shadow); }
  .step.at_risk { border-left-color: var(--bad); }
  .step .title { font-size: 18px; font-weight: 650; margin-bottom: 4px; }
  .step .text { color: var(--muted); overflow-wrap: anywhere; }
  .step .tools { margin-top: 12px; align-items: center; }
  .moment { display: flex; gap: 10px; align-items: center; background: var(--ok-soft); color: var(--ok); border-radius: var(--radius);
    padding: 10px 14px; margin-bottom: 12px; font-size: 14px; }
  .moment b { font-weight: 650; }
  .moment button { margin-left: auto; border: 0; background: none; color: inherit; font-size: 18px; line-height: 1; padding: 0 4px; }
  .nudge { background: var(--accent-soft); border-radius: var(--radius); padding: 12px 14px; margin: 10px 0; font-size: 14px; }
  .nudge b { display: block; margin-bottom: 2px; }

  /* L2: glance rows. A level shape and one chip. */
  .item { display: flex; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); align-items: flex-start; }
  .item:first-child { border-top: 0; }
  .item .body { min-width: 0; flex: 1; }
  .item .stmt { overflow-wrap: anywhere; }
  .item .side { flex: none; text-align: right; }
  .meta { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; font-size: 13px; color: var(--muted); margin-top: 2px; }
  .mark { flex: none; width: 10px; height: 10px; margin-top: 7px; border: 2px solid var(--obs); }
  .mark.observation { border-radius: 2px; background: var(--obs); }
  .mark.finding { border-radius: 50%; border-style: dashed; border-color: var(--fnd); }
  .mark.insight { transform: rotate(45deg); border-color: var(--ins); background: var(--ins); }
  .chip { display: inline-block; font-size: 12px; line-height: 18px; padding: 0 8px; border-radius: 99px; color: var(--muted); white-space: nowrap; border: 1px solid transparent; }
  .chip.draft, .chip.replaced { border: 1px dashed var(--line-strong); }
  .chip.contested { background: var(--bad-soft); color: var(--bad); }
  .chip.needs_changes { background: var(--warn-soft); color: var(--warn); }
  .level { font-size: 13px; font-weight: 600; }
  .level.observation { color: var(--obs); } .level.finding { color: var(--fnd); } .level.insight { color: var(--ins); }
  .person { color: var(--text); white-space: nowrap; }
  .sme { font-size: 11px; padding: 0 5px; border-radius: 4px; margin-left: 4px; border: 1px solid var(--line-strong); color: var(--muted); vertical-align: 1px; }
  .alert { border-radius: 8px; padding: 8px 12px; margin: 8px 0; font-size: 14px; }
  .alert.bad { background: var(--bad-soft); color: var(--bad); }
  .alert.warn { background: var(--warn-soft); color: var(--warn); }
  .alert.ok { background: var(--ok-soft); color: var(--ok); }
  .alert.quiet { background: var(--surface-2); color: var(--text); }
  .detail .statement { font-size: 20px; line-height: 1.4; margin: 6px 0; overflow-wrap: anywhere; }
  .tools { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0 0; align-items: center; }
  .versions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 8px; }
  .versions > div { border: 1px solid var(--line); border-radius: 8px; padding: 10px; background: var(--surface); color: var(--text); }

  /* L3: on request */
  details.fold { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 12px; }
  details.fold > summary { cursor: pointer; padding: 12px 16px; font-weight: 600; list-style: none; display: flex; justify-content: space-between; gap: 8px; }
  details.fold > summary::-webkit-details-marker { display: none; }
  details.fold > summary::after { content: "Show"; font-weight: 400; font-size: 13px; color: var(--accent); }
  details.fold[open] > summary::after { content: "Hide"; }
  details.fold > summary .n { color: var(--muted); font-weight: 400; margin-left: 6px; }
  details.fold > .in { padding: 0 16px 14px; }
  details.more { position: relative; display: inline-block; }
  details.more > summary { list-style: none; cursor: pointer; border: 1px solid var(--line-strong); border-radius: 8px; padding: 6px 12px; background: var(--surface); }
  details.more > summary::-webkit-details-marker { display: none; }
  details.more .menu { position: absolute; z-index: 4; top: calc(100% + 4px); left: 0; min-width: 220px; background: var(--surface); border: 1px solid var(--line);
    border-radius: 10px; box-shadow: 0 6px 24px rgba(0,0,0,.12); padding: 6px; display: grid; }
  details.more .menu button { border: 0; text-align: left; border-radius: 6px; }
  .review { padding: 8px 0; border-top: 1px solid var(--line); }
  .review:first-child { border-top: 0; }
  .review.old { opacity: .6; }

  /* L4: record */
  .feed { list-style: none; padding: 0; margin: 0; font-size: 14px; }
  .feed li { padding: 6px 0; border-top: 1px solid var(--line); overflow-wrap: anywhere; }
  .feed li:first-child { border-top: 0; }

  .search { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .search input { flex: 1 1 220px; width: auto; }
  .search select { width: auto; }

  /* Dialogs and pickers */
  dialog { border: 1px solid var(--line); border-radius: 14px; padding: 0; width: min(560px, calc(100vw - 24px)); background: var(--surface); color: var(--text); box-shadow: 0 10px 40px rgba(0,0,0,.2); }
  dialog::backdrop { background: rgba(20,20,18,.45); }
  dialog form { padding: 18px 20px; max-height: 85vh; overflow: auto; }
  dialog .foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
  .choices { display: grid; gap: 8px; margin-top: 8px; }
  .choice { display: block; text-align: left; white-space: normal; padding: 12px 14px; border-radius: 10px; }
  label.choice { margin: 0; border: 1px solid var(--line-strong); background: var(--surface); color: var(--text); font-size: 15px; cursor: pointer; position: relative; }
  .choice b { display: block; font-size: 15px; }
  .choice span { color: var(--muted); font-size: 13px; }
  .choice:has(input:checked), .choice.on { border-color: var(--accent); background: var(--accent-soft); }
  .choice input { position: absolute; opacity: 0; pointer-events: none; }
  .pills { display: flex; gap: 6px; flex-wrap: wrap; }
  .pills label { margin: 0; }
  .pills input { position: absolute; opacity: 0; pointer-events: none; }
  .pills span { display: inline-block; border: 1px solid var(--line-strong); border-radius: 99px; padding: 4px 12px; font-size: 14px; color: var(--text); cursor: pointer; }
  .pills input:checked + span { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
  .picker .results { border: 1px solid var(--line); border-radius: 8px; margin-top: 4px; max-height: 200px; overflow: auto; }
  .picker .results:empty { display: none; }
  .picker .results button { display: block; width: 100%; text-align: left; border: 0; border-radius: 0; border-top: 1px solid var(--line); white-space: normal; }
  .picker .results button:first-child { border-top: 0; }
  .tag { display: inline-flex; gap: 6px; align-items: center; background: var(--surface-2); border-radius: 99px; padding: 2px 4px 2px 10px; margin: 6px 6px 0 0; font-size: 13px; }
  .tag button { border: 0; background: none; padding: 0 6px; }
  .who-list { display: grid; gap: 6px; margin-top: 8px; }
  .who-list button { text-align: left; display: flex; justify-content: space-between; }
  #toast:not(:empty) { position: fixed; left: 16px; right: 16px; bottom: 76px; max-width: 560px; margin: 0 auto; z-index: 20; cursor: pointer; box-shadow: 0 4px 16px rgba(0,0,0,.15); }

  @media (max-width: 860px) { .grid { grid-template-columns: 1fr; } }
  @media (max-width: 720px) {
    .top { padding: 10px 16px; }
    .brand small, .acting { display: none; }
    .shell { display: block; }
    nav.side { position: fixed; top: auto; bottom: 0; left: 0; right: 0; z-index: 6; flex-direction: row; justify-content: space-around;
      padding: 4px; gap: 0; background: var(--surface); border-top: 1px solid var(--line); }
    nav.side a { flex: 1; flex-direction: column; gap: 0; padding: 6px 2px; font-size: 12px; justify-content: center; text-align: center; }
    nav.side .count { font-size: 10px; padding: 0 5px; }
    main { padding: 16px 16px 90px; }
    .versions { grid-template-columns: 1fr; }
    button, select, input, details.more > summary { min-height: 40px; }
  }
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="#/home">ANCHOR<small>what the team has learned, and how far to trust it</small></a>
  <div class="me" id="me"></div>
</header>
<div class="shell">
  <nav class="side" id="nav"></nav>
  <main id="main"><div class="empty">Loading...</div></main>
</div>
<dialog id="dlg"><form method="dialog" id="dlg-form"></form></dialog>
<div id="toast" class="alert"></div>

<script>
// ---------------------------------------------------------------------------
// ANCHOR web app. Plain HTML and JS with no build step, so the same page runs
// against the local server and inside the Pyodide demo. Every action calls the
// same core functions as the MCP server. Words come from docs/GLOSSARY.md.
// ---------------------------------------------------------------------------

const $ = (sel, el = document) => el.querySelector(sel);
const $$ = (sel, el = document) => [...el.querySelectorAll(sel)];
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const enc = encodeURIComponent;

const S = { me: null, config: null, people: {}, queue: null };

const NAV = { home: "Home", studies: "Studies", learnings: "Learnings", review: "Review", decisions: "Decisions" };
const VERDICT = { approve: "Approved", changes: "Asked for changes", disagree: "Disagreed" };
const STAGE = { requested: "Requested", planned: "Planned", running: "Running", finished: "Finished", dropped: "Dropped" };
const LINK = { supports: "supports", builds_on: "builds on", same_as: "is the same as", conflicts_with: "conflicts with" };
const ORIGIN = { person: "", person_with_ai: "with AI", ai_agent: "by an AI agent" };
const NEXT_LEVEL = { observation: "finding", finding: "insight" };
const CHECKED = ["checked_by_sme", "checked_by_peers"];
const KINDS = {
  observation: ["Something we saw", "What we saw or measured, with no reading into it. For example: 7 of 12 people left the address form."],
  finding: ["What it might mean", "A pattern or reading across what we saw. Not yet an insight. For example: people drop off when they type a full address."],
  insight: ["What to do about it", "What it means for us, and what to do. For example: autofill is likely our biggest checkout win."],
};

// -- data --------------------------------------------------------------------

async function call(path, body) {
  const res = await fetch(path, body ? { method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body) } : {});
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || "request failed");
  return data;
}
const get = (path) => call("/api/" + path);
const post = (action, body) => call("/api/" + action, body);

function toast(text, kind = "warn") {
  const t = $("#toast");
  t.className = "alert " + kind;
  t.textContent = text || "";
  clearTimeout(toast.timer);
  if (text) toast.timer = setTimeout(() => (t.textContent = ""), 7000);
}
$("#toast").onclick = () => toast("");

async function loadPeople() {
  S.people = Object.fromEntries((await get("people")).map((p) => [p.name.toLowerCase(), p]));
}

// -- small pieces ------------------------------------------------------------

const levelLabel = (l) => S.config.levels[l] || l;
const roleLabel = (r) => S.config.roles[r]?.label || r;
const isMe = (name) => !!S.me && (name || "").toLowerCase() === S.me.name.toLowerCase();
function when(t) {
  if (!t) return "";
  const s = (Date.now() - new Date(t)) / 1000;
  const rtf = new Intl.RelativeTimeFormat(undefined, { numeric: "auto" });
  for (const [unit, n] of [["year", 31536000], ["month", 2592000], ["day", 86400], ["hour", 3600], ["minute", 60]]) {
    if (Math.abs(s) >= n) return rtf.format(-Math.round(s / n), unit);
  }
  return "just now";
}
function person(name) {
  if (!name) return "";
  const p = S.people[name.toLowerCase()];
  return `<a class="person" href="#/people/${enc(name)}">${esc(name)}</a>${p?.sme ? `<span class="sme" title="Subject matter expert">SME</span>` : ""}`;
}
const shape = (l) => `<span class="mark ${l}" title="${esc(levelLabel(l))}"></span>`;
const chip = (c) => `<span class="chip ${c.key}">${esc(c.label)}</span>`;
const ref = (id) => `<a href="#/learnings/${id}">#${id}</a>`;
const list = (items, render, empty, max) => items.length
  ? items.slice(0, max || items.length).map(render).join("") : `<div class="empty">${empty}</div>`;
const panel = (title, body, right = "") => `<section class="panel"><h2><span>${title}</span>${right}</h2>${body}</section>`;
const fold = (title, n, body, open = false) => `<details class="fold" ${open ? "open" : ""}><summary><span>${title}${n != null ? `<span class="n">${n}</span>` : ""}</span></summary><div class="in">${body}</div></details>`;
const more = (buttons) => buttons.length ? `<details class="more"><summary>More</summary><div class="menu">${buttons.join("")}</div></details>` : "";
const btn = (act, label, data = {}, cls = "") => `<button type="button" class="${cls}" data-act="${act}" ${Object.entries(data).map(([k, v]) => `data-${k}="${esc(v)}"`).join(" ")}>${esc(label)}</button>`;

// One glance row: a level shape, the statement, and one chip.
function row(l, extra = "") {
  return `<div class="item">${shape(l.level)}<div class="body">
    <a class="stmt" href="#/learnings/${l.id}">${esc(l.statement)}</a>
    <div class="meta">#${l.id} · ${esc(l.owner)}${ORIGIN[l.origin] ? ` ${ORIGIN[l.origin]}` : ""}${extra}</div></div>
    <div class="side">${chip(l.chip)}</div></div>`;
}
const feedItem = (e) => `<li>${esc(e.text)} <span class="muted">${when(e.at)}</span></li>`;

// -- identity ----------------------------------------------------------------

function renderMe() {
  $("#me").innerHTML = S.me
    ? `<span class="muted acting">Acting as</span> ${person(S.me.name)} <button class="link" data-act="who">change</button>`
    : `<button data-act="who">Who are you?</button>`;
}

function chooseWho(firstTime) {
  const groups = Object.entries(S.config.roles).map(([key, r]) => {
    const people = Object.values(S.people).filter((p) => p.role === key);
    if (!people.length) return "";
    return `<h3>${esc(r.label)}</h3><div class="who-list">${people.map((p) =>
      `<button type="button" data-pick="${esc(p.name)}">${esc(p.name)}<span class="muted">${p.sme ? "SME" : ""}</span></button>`).join("")}</div>`;
  }).join("");
  openDialog(`<h2>${firstTime ? "Welcome. Who are you?" : "Switch person"}</h2>
    <p class="muted">What you do is recorded as you. Anyone can add, review, and decide. Reviews from SMEs show as "Checked by an SME".</p>
    ${groups}
    <label>New here? Enter your name</label><input name="name" placeholder="Your name" autocomplete="name">`,
    async (form) => setMe(form.name.value), { submit: "Continue" });
  $$("[data-pick]", $("#dlg")).forEach((b) => b.onclick = () => { $("#dlg").close(); setMe(b.dataset.pick); });
}

async function setMe(name) {
  if (!(name || "").trim()) throw new Error("Enter your name");
  S.me = await post("whoami", { name });
  try { localStorage.setItem("anchor-me", S.me.name); } catch (e) {}
  await Promise.all([loadPeople(), refreshQueue()]);
  renderMe();
  route();
}

// -- dialogs -----------------------------------------------------------------

function openDialog(html, onSubmit, opts = {}) {
  const dlg = $("#dlg"), form = $("#dlg-form");
  form.innerHTML = `${html}<div class="alert bad" id="dlg-err" hidden></div>
    <div class="foot"><button type="button" data-close>Cancel</button>
    ${onSubmit ? `<button class="primary" value="ok">${opts.submit || "Save"}</button>` : ""}</div>`;
  $("[data-close]", form).onclick = () => dlg.close();
  form.onsubmit = async (e) => {
    e.preventDefault();
    try {
      const keepOpen = (await onSubmit(form)) === true;
      if (!keepOpen) dlg.close();
    } catch (err) {
      const box = $("#dlg-err"); box.hidden = false; box.textContent = err.message;
    }
  };
  $$(".picker", form).forEach(wirePicker);
  if (!dlg.open) dlg.showModal();
  const first = $("input:not([type=radio]):not([type=checkbox]), textarea", form);
  if (first && !opts.noFocus) first.focus();
}

// A search box that picks one or more learnings. Picked ids are read with picked(form, name).
function pickerHtml(name, { multi = true, exclude = [], preset = [] } = {}) {
  return `<div class="picker" data-name="${name}" data-multi="${multi}" data-exclude="${exclude.join(",")}">
    <input placeholder="Search learnings by topic" data-q>
    <div class="results"></div><div class="picked">${preset.map(tag).join("")}</div></div>`;
}
const tag = (l) => `<span class="tag" data-id="${l.id}">#${l.id} ${esc(l.statement.slice(0, 50))}${l.statement.length > 50 ? "..." : ""}<button type="button" aria-label="Remove">&times;</button></span>`;
function wirePicker(el) {
  const out = $(".results", el), picked = $(".picked", el), exclude = el.dataset.exclude.split(",").map(Number);
  let timer;
  $("[data-q]", el).oninput = (e) => {
    clearTimeout(timer);
    timer = setTimeout(async () => {
      const q = e.target.value.trim();
      if (!q) { out.innerHTML = ""; return; }
      const found = (await get(`learnings?q=${enc(q)}&limit=8`)).filter((l) => !exclude.includes(l.id));
      out.innerHTML = found.map((l) => `<button type="button" data-id="${l.id}">${chip(l.chip)} #${l.id} ${esc(l.statement)}</button>`).join("")
        || `<div class="empty" style="padding:8px">No match</div>`;
      $$("button", out).forEach((b) => b.onclick = () => {
        const l = found.find((x) => x.id === Number(b.dataset.id));
        if (el.dataset.multi !== "true") picked.innerHTML = "";
        if (!$(`[data-id="${l.id}"]`, picked)) picked.insertAdjacentHTML("beforeend", tag(l));
        out.innerHTML = ""; e.target.value = "";
      });
    }, 200);
  };
  picked.onclick = (e) => { if (e.target.closest("button")) e.target.closest(".tag").remove(); };
}
const picked = (form, name) => $$(`.picker[data-name="${name}"] .tag`, form).map((c) => Number(c.dataset.id));

// Run an action, show its warnings, and refresh.
async function act(action, body, done) {
  const r = await post(action, body);
  const warnings = r.warnings || [];
  toast(warnings.length ? warnings.join(" ") : done || "Saved.", warnings.length ? "warn" : "ok");
  await Promise.all([loadPeople(), refreshQueue()]);
  await route();
  return r;
}

// The one action most worth doing on a learning, for this person.
function primaryFor(l) {
  const me = S.me?.name || "", mine = isMe(l.owner);
  const reviewed = l.reviews.some((r) => r.current && isMe(r.by));
  const checked = CHECKED.includes(l.trust.state);
  if (l.stage === "draft") return mine ? ["confirm", "Confirm"] : null;
  if (l.stage === "replaced") return ["open-learning", "See the newer version", { learning: l.replaced_by[0].id }];
  if (mine && l.trust.state === "needs_changes") return ["revise", "Revise"];
  if (!mine && !reviewed && me) return ["review", "Review"];
  if (mine && l.trust.state === "not_reviewed" && !l.open_requests.length) return ["ask-review", "Ask for review"];
  if (l.promotion && checked && l.promotion.ready && !l.promoted_to.length) return ["promote", `Promote to ${levelLabel(NEXT_LEVEL[l.level]).toLowerCase()}`];
  if (checked) return ["decide", "Use in a decision"];
  return ["follow", "Follow changes"];
}

    `${esc(x.did)} ${x.learning_id ? ref(x.learning_id) : `<a href="#/studies/${x.study_id}">the study</a>`}`).join(", ")}</div>`).join("");
  const outcomeCard = d.outcome_due
    ? `<section class="step"><div class="title">What happened?</div><div class="text">It has been a while since this decision. How did it go? If it raised a new question, you can ask for research next.</div>
        <div class="tools">${btn("outcome", "Add what happened", { decision: d.id }, "primary")}</div></section>` : "";
  return `<div class="page-head"><div><div class="crumb"><a href="#/decisions">Decisions</a></div><h1>${esc(d.title)}</h1>
      <div class="meta">Made by ${person(d.made_by)} ${when(d.at)}</div></div>
    <div class="actions">${more([btn("add-to-decision", "Add a learning it used", { id: d.id }), !d.outcome_due ? btn("outcome", d.outcome ? "Edit what happened" : "Add what happened", { decision: d.id }) : "",
      btn("ask", "Ask for research", { decision: d.id })].filter(Boolean))}</div></div>
    ${d.at_risk.length ? `<div class="alert bad">Something this decision relied on is now contested: ${d.at_risk.map(ref).join(", ")}. Take a look.</div>` : ""}
    ${mine ? outcomeCard : ""}
    ${d.outcome ? `<div class="alert quiet"><b>What happened:</b> ${esc(d.outcome)}</div>` : ""}
    ${d.note ? `<p>${esc(d.note)}</p>` : ""}
    ${panel("What it relied on", used || `<div class="empty">No learnings linked.</div>`)}
    ${panel("The people behind it", names ? `<p>${names}</p>${fold("What each person did", null, credits)}` : `<div class="empty">No learnings linked, so no one to credit yet.</div>`)}
    ${d.requests.length ? fold("Research it raised", d.requests.length, d.requests.map((s) => studyRow({ ...s, learning_count: undefined })).join("")) : ""}`;
};

views.person = async (name) => {

  return `<div class="page-head"><div><h1>${esc(p.name)}</h1><div class="sub">${esc(p.role_label)}${p.sme ? " · SME" : ""}${isMe(p.name) ? " · you" : ""}</div></div>
    <div class="actions"><label class="inline">Role ${roleSelect}</label><label class="inline"><input type="checkbox" data-act="sme" data-name="${esc(p.name)}" ${p.sme ? "checked" : ""}>SME</label></div></div>
    ${panel("Their work informed", list(p.contributed_to, (d) => `<div class="item"><div class="body"><a href="#/decisions/${d.id}">${esc(d.title)}</a>

// -- actions -----------------------------------------------------------------

const fieldInputs = (stage, s = {}) => S.config.study.fields.filter((f) => f.ask_at === stage).map((f) =>
  `<label>${esc(f.label)}${f.required ? " (the team asks for this)" : ""}</label><input name="field:${esc(f.key)}" value="${esc(s.fields?.[f.key])}" placeholder="${esc(f.help || "")}">`).join("");
const formValues = (form) => {
  const v = { fields: {} };
  for (const [k, val] of new FormData(form)) k.startsWith("field:") ? (v.fields[k.slice(6)] = val) : (v[k] = val);
  return v;
};

// Capture a learning in short steps: what, then what kind, then evidence if you have it.
function addDialog(studyId, statement = "") {
  openDialog(`<h2>What did you learn?</h2><p class="muted">One sentence is enough.</p>
    <textarea name="statement" required>${esc(statement)}</textarea>
    <p class="muted" style="margin-top:8px">Have a pile of notes? Ask your AI tool to "Synthesize my notes" instead.</p>`,
    async (form) => { if (!form.statement.value.trim()) throw new Error("Write one sentence first"); kindStep(studyId, form.statement.value); return true; },
    { submit: "Next" });
}
async function kindStep(studyId, statement) {
  const studies = (await get("studies")).filter((s) => !["requested", "dropped"].includes(s.status));
  openDialog(`<h2>What kind is it?</h2><p class="muted">"${esc(statement)}"</p>
    <div class="choices">${Object.entries(KINDS).map(([k, [title, text]], i) => `<label class="choice button"><input type="radio" name="level" value="${k}" ${i ? "" : "checked"}>
      <b>${esc(title)} <span class="muted">(${esc(levelLabel(k))})</span></b><span>${esc(text)}</span></label>`).join("")}</div>
    <label class="inline" style="margin-top:12px"><input type="checkbox" name="ai"> An AI helped write this. It stays a draft until you confirm it.</label>
    <details ${studyId ? "open" : ""}><summary class="muted" style="cursor:pointer;margin-top:10px">Add evidence or a study</summary>
      <label>Learnings that support it</label>${pickerHtml("evidence")}
      <label>Study</label><select name="study"><option value="">None</option>${studies.map((s) => `<option value="${s.id}" ${s.id === studyId ? "selected" : ""}>${esc(s.question)}</option>`).join("")}</select>
    </details><input type="hidden" name="statement" value="${esc(statement)}">`,
    async (form) => {
      const r = await act("add", { statement, level: form.level.value, owner: needMe(), origin: form.ai.checked ? "person_with_ai" : "person",
        evidence: picked(form, "evidence"), study_id: form.study.value ? Number(form.study.value) : null }, "Added.");
      if (r.possible_conflicts.length) {
        $("#dlg-form").innerHTML = `<h2>Added #${r.learning.id}</h2><div class="alert warn">It may conflict with something already checked. Take a look.</div>
          ${candidates({ candidates: r.possible_conflicts }, r.learning.id)}<div class="foot"><button type="button" onclick="document.getElementById('dlg').close()">Done</button></div>`;
        return true;
      }
      location.hash = `#/learnings/${r.learning.id}`;
    }, { submit: "Save", noFocus: true });
}

// Review in two steps: where you stand, then one follow-up that fits it.
async function reviewDialog(id) {
  const l = await get(`learnings/${id}`);
  openDialog(`<h2>Review</h2><p>"${esc(l.statement)}"</p><p class="muted">${esc(l.trust.summary)}</p>
    <div class="choices">
      <button type="button" class="choice" data-verdict="approve"><b>Approve</b><span>It holds up.</span></button>
      <button type="button" class="choice" data-verdict="changes"><b>Ask for changes</b><span>Close, but something should change.</span></button>
      <button type="button" class="choice" data-verdict="disagree"><b>Disagree</b><span>It does not hold up. This marks it Contested.</span></button>
    </div>
    <p class="muted" style="margin-top:10px"><button type="button" class="link" data-help>How reviews count</button></p>
    <p class="muted" hidden id="review-help">Your latest review is the one that counts. Approvals from SMEs show as Checked by an SME; everyone else's as Checked by peers. Asking for changes shows Needs changes until the owner revises. Disagreeing shows Contested.</p>`, null);
  $("[data-help]", $("#dlg")).onclick = () => { $("#review-help").hidden = false; };
  $$("[data-verdict]", $("#dlg")).forEach((b) => b.onclick = () => reviewStep(l, b.dataset.verdict));
}
function reviewStep(l, verdict) {
  const follow = {
    approve: `<label>How did you check? (optional)</label><div class="pills">${Object.entries(S.config.checks).map(([k, v]) =>
      `<label><input type="radio" name="how" value="${k}"><span>${esc(v)}</span></label>`).join("")}</div>`,
    changes: `<label>What should change?</label><textarea name="note" required></textarea>`,
    disagree: `<label>Why?</label><textarea name="note" required></textarea>`,
  }[verdict];
  openDialog(`<h2>${VERDICT[verdict]}</h2><p>"${esc(l.statement)}"</p>${follow}`,
    (form) => act("review", { learning_id: l.id, by: needMe(), verdict, how: form.how?.value || null, note: form.note?.value || null }, "Review recorded."),
    { submit: verdict === "approve" ? "Approve" : "Send", noFocus: verdict === "approve" });
}

async function confirmDialog(id) {
  const l = await get(`learnings/${id}`);
  openDialog(`<h2>Confirm this AI draft</h2><p class="muted">Check it against what you know. Fix the wording if it says more, or less, than you mean.</p>
    <label>The learning</label><textarea name="statement">${esc(l.statement)}</textarea>
    <label>What did you check or change? (optional)</label><input name="note" placeholder="For example: checked it against the interview notes">`,
    (form) => act("confirm", { learning_id: l.id, by: needMe(), statement: form.statement.value, note: form.note.value }, "Confirmed. It is ready for review."),
    { submit: "Confirm" });
}

function studyStageDialog(s, stage) {
  const body = {
    start: `<label>Decision it serves</label><input name="decision" value="${esc(s.decision)}" placeholder="For example: whether to fund autofill in Q3">${fieldInputs("start", s)}`,
    running: `<label>Method</label><input name="method" value="${esc(s.method)}" placeholder="For example: funnel analysis and interviews">
      <label>Who or what you studied</label><input name="sample" value="${esc(s.sample)}" placeholder="For example: 8 recent mobile shoppers">${fieldInputs("running", s)}
      <p class="muted" style="margin-top:8px">Not sure yet? Ask your AI tool to "Plan a study". It checks what is already known first.</p>`,
    finished: `<label>What did we learn?</label><textarea name="learned">${esc(s.learned)}</textarea>${fieldInputs("finished", s)}
      <p class="muted" style="margin-top:8px">If a learning is ready, promote it from its page.</p>`,
  }[stage];
  const status = { running: "running", finished: "finished" }[stage];
  openDialog(`<h2>${{ start: "The decision it serves", running: "How are you running it?", finished: "Wrap it up" }[stage]}</h2><p class="muted">${esc(s.question)}</p>${body}`,
    (form) => act("update_study", { study_id: s.id, by: needMe(), ...formValues(form), ...(status && s.status !== status ? { status } : {}) }),
    { submit: status && s.status !== status ? `Mark ${status}` : "Save" });
}

      <label>Which learnings did it rely on?</label>${pickerHtml("used", { preset })}`,

function candidates(result, fromId) {
  if (!result.candidates.length) return `<div class="alert ok">Nothing checked on a similar topic.</div>`;
  return `<h3>Checked learnings on a similar topic</h3><p class="muted">You decide if these truly conflict.</p>` + result.candidates.map((c) => `
    <div class="item">${shape(c.learning.level)}<div class="body"><a href="#/learnings/${c.learning.id}">${esc(c.learning.statement)}</a>
      <div class="meta">${chip(c.learning.chip)} shared words: ${esc(c.shared_words.join(", "))}</div>
      <div class="meta" style="color:var(${c.likely_conflict ? "--bad" : "--muted"})">${c.signals.length ? "Signals: " + esc(c.signals.join("; ")) : "No signs of a conflict. It may be related, or the same."}</div>
      ${fromId ? `<div class="tools">${btn("confirm-conflict", "They conflict", { id: fromId, other: c.learning.id })}</div>` : ""}</div></div>`).join("");
}

// -- routing and events --------------------------------------------------------

const ROUTES = [
  [/^#\/home$/, "home", "home"], [/^#\/activity$/, "activity", "home"],
  [/^#\/studies$/, "studies", "studies"], [/^#\/studies\/(\d+)$/, "study", "studies"],
  [/^#\/learnings(\?.*)?$/, "learnings", "learnings"], [/^#\/learnings\/(\d+)$/, "learning", "learnings"],
  [/^#\/review$/, "review", "review"],
  [/^#\/decisions$/, "decisions", "decisions"], [/^#\/decisions\/(\d+)$/, "decision", "decisions"],
  [/^#\/people\/(.+)$/, "person", null],
];

function renderNav(active) {
  const q = S.queue, waiting = q ? q.waiting_on_me.length + q.drafts.length + q.feedback_on_mine.length : 0;
  $("#nav").innerHTML = S.config.modes.map((m) => `<a href="#/${m}" class="${m === active ? "on" : ""}">${NAV[m]}${m === "review" && waiting ? `<span class="count">${waiting}</span>` : ""}</a>`).join("");
}

async function refreshQueue() {
  if (!S.me) return;
  try { S.queue = await get(`queue?who=${enc(S.me.name)}`); } catch (e) {}
}

async function route() {
  const match = ROUTES.map(([re, view, nav]) => [location.hash.match(re), view, nav]).find(([m]) => m);
  if (!match) { location.hash = "#/home"; return; }
  const [m, view, nav] = match;
  renderNav(nav);
  try {
    const arg = m[1] && !m[1].startsWith("?") ? decodeURIComponent(m[1]) : undefined;
    $("#main").innerHTML = await views[view](arg);
  } catch (e) {
    $("#main").innerHTML = S.me ? `<div class="alert bad">${esc(e.message)}</div>` : `<div class="nudge"><b>Welcome to ANCHOR.</b>Choose who you are to get started.</div>`;
  }
}

document.addEventListener("click", async (ev) => {
  const b = ev.target.closest("[data-act]");
  if (!b || b.tagName === "SELECT" || b.tagName === "INPUT") return;
  ev.preventDefault();
  b.closest("details.more")?.removeAttribute("open");
  try { await actions[b.dataset.act](b); } catch (e) { toast(e.message, "bad"); }
});
document.addEventListener("change", async (ev) => {
  const el = ev.target.closest("select[data-act=role], input[data-act=sme]");
  if (!el) return;
  const body = el.tagName === "SELECT" ? { role: el.value } : { sme: el.checked };
  try { await act("set_person", { name: el.dataset.name, by: needMe(), ...body }, "Updated. Everyone can see this change in the activity record.");
    if (isMe(el.dataset.name)) { S.me = await post("whoami", { name: S.me.name }); renderMe(); } } catch (e) { toast(e.message, "bad"); }
});
document.addEventListener("submit", async (ev) => {
  const form = ev.target.closest("form[data-form]");
  if (!form) return;
  ev.preventDefault();
  const kind = form.dataset.form;
  if (kind === "learnings-search") location.hash = "#/learnings?" + new URLSearchParams(new FormData(form));
  if (kind === "claim") $("#claim-result").innerHTML = candidates(await post("check_conflict", { statement: form.statement.value }), null);
  if (kind === "home-search") {
    const q = form.q.value.trim();
    const found = await get(`learnings?q=${enc(q)}&limit=20`);
    const checked = found.filter((l) => CHECKED.includes(l.trust.state));
    $("#home-results").innerHTML = list(checked, (l) => row(l), `Nothing checked matches yet. <button class="link" data-act="ask" data-query="${esc(q)}">Ask for research</button>`, 5)
      + (found.length > checked.length ? `<p class="muted"><a href="#/learnings?q=${enc(q)}">${found.length - checked.length} more not checked yet</a></p>` : "");
  }
});
window.addEventListener("hashchange", route);

// Pick up changes made elsewhere (another person, or an AI tool over MCP)
// unless someone is typing, has a dialog or a section open.
setInterval(async () => {
  const busy = $("#dlg").open || ["INPUT", "TEXTAREA", "SELECT"].includes(document.activeElement?.tagName)
    || $("details[open]") || $("#conflict-check:not(:empty)") || $("#home-results:not(:empty)");
  if (busy || !S.me) return;
  await loadPeople(); await refreshQueue(); route();
}, 15000);

(async function start() {
  S.config = await get("config");
  await loadPeople();
  let saved = null;
  try { saved = localStorage.getItem("anchor-me"); } catch (e) {}
  if (saved) { try { S.me = await post("whoami", { name: saved }); } catch (e) {} }
  renderMe();
  await refreshQueue();
  if (!location.hash) location.hash = "#/home";
  await route();
  if (!S.me) chooseWho(true);
})();
</script>
</body>
