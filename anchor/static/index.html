  if (d.how) { S.how = S.how === d.how ? null : d.how; document.querySelectorAll("[data-how]").forEach(b => b.setAttribute("aria-pressed", b.dataset.how === S.how)); return; }
  if (t.hasAttribute("data-skip")) { S.checking.skipped.push(S.panel.id); return nextCheck(S.panel.id); }
  if (d.pkg) { await setPackage([...S.ws.package, +d.pkg]); return S.panel && renderPanel(); }
  if (d.unpkg) { await setPackage(S.ws.package.filter(x => x !== +d.unpkg)); return S.panel && renderPanel(); }
  if (d.saveQ) {
    const text = document.querySelector(`[data-qtext="${d.saveQ}"]`).value.trim();
    if (!text) return toast("Write the sub-question first.", true);
    S.openQ = +d.saveQ;
    if (await run(() => api("update_question", { question_id: +d.saveQ, by: S.me, text, expect: document.querySelector(`[data-qexpect="${d.saveQ}"]`).value.trim() }))) { toast("Sub-question saved."); await reload(); }
    return;
  }
  if (d.removeQ) {
    const out = await run(() => api("remove_question", { question_id: +d.removeQ, by: S.me }));
    if (out) { toast(out.untagged.length ? `Removed. ${plural(out.untagged.length, "block")} no longer ${out.untagged.length === 1 ? "answers" : "answer"} anything.` : "Removed."); await reload(); }
    return;
  }
  if (d.answerQ) {
    S.answering = +d.answerQ; S.selected.clear(); S.connecting = true;
    if (S.view !== "build") await setView("build"); else { renderConnect(); renderBuild(); }
    return toast("Pick the blocks that answer it, then write what they add up to.");
  }
  switch (t.id) {
    case "queue-btn": case "queue-start": return startChecking();
    case "v-build": case "v-back": return setView("build");
    case "v-list": return setView("list");
    case "breakdown-btn": return setView("breakdown");
    case "wide":
      S.wide = !S.wide; local.set("wide", S.wide); $("app").classList.toggle("wide", S.wide);
      await renderPanel(); if (S.view === "build") setTimeout(renderBuild, 230); return;
    case "connect-btn": S.connecting = !S.connecting; S.selected.clear(); S.answering = null; renderConnect(); renderBuild(); return;
    case "connect-cancel": S.selected.clear(); S.connecting = false; S.answering = null; renderConnect(); renderBuild(); return;
    case "connect-add": return connect();
    case "connect-prompt": return copy(connectPrompt([...S.selected], $("connect-add").dataset.target), "Prompt copied. Paste it into your AI tool.");
    case "bd-run": return bdRun();
    case "bd-sample": $("bd-text").value = SAMPLE_AI_TEXT; $("bd-title").value = "AI summary of checkout research"; return;
    case "bd-add": return bdAdd();
    case "bd-again": S.bd = { text: S.bd.text, title: S.bd.title }; renderBreakdown(); return renderPanel();
    case "bd-prompt": return copy(breakdownPrompt($("bd-text").value.trim()), "Prompt copied. Paste it into your AI tool.");
    case "copy-obs-prompt": return copy(obsPrompt(), "Prompt copied. Paste it into your AI tool.");
    case "copy-plan-prompt": return copy(planPrompt(), "Prompt copied. Paste it into your AI tool.");
    case "add-q": {
      const text = $("q-text").value.trim();
      if (!text) { $("q-text").focus(); return toast("Write the sub-question first.", true); }
      const out = await run(() => api("add_question", { study_id: S.ws.id, by: S.me, text, expect: $("q-expect").value.trim() || null }));
      if (out) { toast(out.warnings.length ? out.warnings[0][0].toUpperCase() + out.warnings[0].slice(1) + "." : "Added to the plan."); await reload(); }
      return;
    }
    case "save-part": {
      const k = d.key, body = { study_id: S.ws.id, by: S.me };
      if (k === "plan") { body.question = $("f-question").value.trim(); body.decision = $("f-decision").value.trim(); }
      else body[k] = $("f-" + k).value.trim();
      if (await run(() => api("update_study", body))) { toast("Base updated."); await reload(); }
      return;
    }
    case "add-src": {
      const title = $("n-title").value.trim(), body = $("n-body").value.trim();
      if (!title || !body) return toast("Add a title and some text.", true);
      if (await run(() => api("add_source", { study_id: S.ws.id, by: S.me, title, body, kind: $("n-kind").value }))) { toast("Source added to the base."); await reload(); }
      return;
    }
  }
});
document.addEventListener("mouseover", e => {
  if (S.view !== "build" || S.connecting || !S.ws) return;
  const b = e.target.closest?.(".brick");
  if (b) trace(+b.dataset.id);
});
document.addEventListener("mouseout", e => {
  if (S.view !== "build" || !S.ws) return;
  const b = e.target.closest?.(".brick");
  if (b && !b.contains(e.relatedTarget)) highlight();
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.dataset.think) local.set("think-" + t.dataset.think, t.value);
  if (t.dataset.bdtext != null && S.bd?.pieces) S.bd.pieces[+t.dataset.bdtext].statement = t.value;
});
// After a level or wording change, ask the core again, so the flags stay true.
document.addEventListener("change", async e => {
  const t = e.target;
  if (t.dataset.answers) {
    const out = await run(() => api("set_answers", { learning_id: +t.dataset.answers, by: S.me, question_id: +t.value || null }));
    if (out) { toast(t.value ? "Now answers that sub-question." : "No longer answers a sub-question."); await reload(); }
    return;
  }
  if (t.dataset.bdlevel != null && S.bd?.pieces) { S.bd.pieces[+t.dataset.bdlevel].level = t.value; bdPreview(true); }
  if (t.dataset.bdtext != null && S.bd?.pieces) bdPreview(true);
});
document.addEventListener("focusin", e => {
  const row = e.target.closest?.("[data-bdrow]");
  if (!row || !S.bd?.pieces || S.bdOn === +row.dataset.bdrow) return;
  S.bdOn = +row.dataset.bdrow;
  document.querySelectorAll(".bdrow").forEach(r => r.classList.toggle("on", +r.dataset.bdrow === S.bdOn));
  renderPanel();
});
document.addEventListener("keydown", e => {
  const typing = e.target.closest?.("input, textarea, select");
  if (e.key === "Escape") {
    if (S.connecting) { S.connecting = false; S.selected.clear(); renderConnect(); return renderBuild(); }
    if (S.panel && S.panel.type !== "workspace" && S.panel.type !== "breakdown") return closePanel();
  }
  if (!typing && S.ws && (e.key === "j" || e.key === "k") && S.view !== "breakdown") {
    const order = S.view === "list" ? [...document.querySelectorAll("#view .rrow")].filter(n => n.offsetParent).map(n => +n.dataset.open) : S.ws.blocks.map(b => b.id);
    const at = order.indexOf(S.panel?.type === "block" ? S.panel.id : null);
    const next = order[at < 0 ? 0 : Math.max(0, Math.min(order.length - 1, at + (e.key === "j" ? 1 : -1)))];
    if (next != null) openPanel({ type: "block", id: next });
  }
  if ((e.key === "Enter" || e.key === " ") && e.target.classList?.contains("brick")) { e.preventDefault(); e.target.click(); }
  if (e.key === "Enter" && e.target.id === "connect-text") connect();
});
$("me").addEventListener("change", async e => {
  S.me = e.target.value;
  try { localStorage.setItem("anchor-me", S.me); } catch (err) {}
  if (S.ws) { const p = S.panel; S.checking = null; await openWorkspace(S.ws.id); if (p && p.type !== "workspace") await openPanel(p); } else renderHome();
});
let rz; window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => S.ws && S.view === "build" && renderBuild(), 120); });

// ---------- Start ----------
(async () => {
  try {
    [S.people, S.config] = await Promise.all([api("people"), api("config")]);
    S.wide = local.get("wide", false); S.lines = local.get("lines", "faint");
    $("app").classList.toggle("wide", S.wide);
    let saved = null;
    try { saved = localStorage.getItem("anchor-me"); } catch (e) {}
    S.me = S.people.find(p => p.name === saved)?.name || S.people.find(p => p.sme)?.name || S.people[0]?.name || "You";
    $("me").innerHTML = (S.people.length ? S.people : [{ name: S.me }]).map(p => `<option value="${esc(p.name)}"${p.name === S.me ? " selected" : ""}>${esc(p.name)}${p.sme ? " (SME)" : ""}</option>`).join("");
    await route();
  } catch (e) {
    $("main").innerHTML = `<div class="loading">Could not load: ${esc(e.message)}</div>`;
  }
})();
</script>
</body>
